<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resilience Test Engineer — Interview Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --bg2: #13161e;
  --bg3: #1a1e29;
  --bg4: #20263a;
  --surface: #1e2332;
  --surface2: #252b3d;
  --border: #2e3450;
  --border2: #3a4160;
  --text: #e8eaf0;
  --text2: #9da3bb;
  --text3: #6b7290;
  --green: #22c55e;
  --green-dim: #166534;
  --amber: #f59e0b;
  --amber-dim: #92400e;
  --red: #ef4444;
  --red-dim: #7f1d1d;
  --violet: #8b5cf6;
  --violet-dim: #4c1d95;
  --violet-soft: rgba(139,92,246,0.15);
  --green-soft: rgba(34,197,94,0.12);
  --transition: 0.3s ease;

  --c1: #22c55e;   /* green */
  --c2: #3b82f6;   /* blue */
  --c3: #f59e0b;   /* amber */
  --c4: #ec4899;   /* pink */
  --c5: #8b5cf6;   /* violet */
  --c6: #06b6d4;   /* cyan */
  --c7: #f97316;   /* orange */
  --c8: #a3e635;   /* lime */
  --c9: #e879f9;   /* fuchsia */
}

[data-theme="light"] {
  --bg: #f0f2f8;
  --bg2: #e8eaf2;
  --bg3: #dde0ec;
  --bg4: #d0d4e8;
  --surface: #ffffff;
  --surface2: #f5f6fc;
  --border: #c8ccde;
  --border2: #b0b5d0;
  --text: #111827;
  --text2: #374151;
  --text3: #6b7280;
  --green: #16a34a;
  --green-dim: #bbf7d0;
  --amber: #d97706;
  --amber-dim: #fde68a;
  --red: #dc2626;
  --red-dim: #fee2e2;
  --violet: #7c3aed;
  --violet-dim: #ede9fe;
  --violet-soft: rgba(124,58,237,0.1);
  --green-soft: rgba(22,163,74,0.1);
  --c1: #16a34a;
  --c2: #2563eb;
  --c3: #d97706;
  --c4: #db2777;
  --c5: #7c3aed;
  --c6: #0891b2;
  --c7: #ea580c;
  --c8: #65a30d;
  --c9: #c026d3;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  font-size: 15px;
  line-height: 1.6;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  transition: background var(--transition), border-color var(--transition);
}

.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 0 0;
}

.header-left { flex: 1; min-width: 0; }

.header-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.25rem;
  color: var(--text);
  letter-spacing: -0.02em;
  transition: color var(--transition);
}

.header-title span {
  color: var(--text3);
  font-weight: 500;
  font-size: 0.85rem;
  display: block;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.04em;
  margin-top: 2px;
}

.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  flex-shrink: 0;
}

/* THEME TOGGLE */
.theme-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}

.theme-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--text3);
  letter-spacing: 0.06em;
}

.toggle-pill {
  width: 44px;
  height: 24px;
  background: var(--bg4);
  border-radius: 12px;
  border: 1px solid var(--border2);
  position: relative;
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition);
}

.toggle-pill::after {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--text3);
  top: 2px;
  left: 3px;
  transition: transform 0.25s ease, background 0.25s ease;
}

[data-theme="light"] .toggle-pill::after {
  transform: translateX(20px);
  background: var(--c5);
}

.toggle-icon { font-size: 0.9rem; }

/* SCORE WIDGET */
.score-widget {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 14px;
  transition: background var(--transition), border-color var(--transition);
}

.score-ring-wrap {
  position: relative;
  width: 52px;
  height: 52px;
  flex-shrink: 0;
}

.score-ring-wrap svg { transform: rotate(-90deg); }

.score-ring-bg { fill: none; stroke: var(--border2); stroke-width: 4; transition: stroke var(--transition); }
.score-ring-fg { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 138; stroke-dashoffset: 138; transition: stroke-dashoffset 0.6s ease, stroke 0.4s ease; }

.score-pct {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--text);
  transition: color var(--transition);
}

.score-info { display: flex; flex-direction: column; gap: 2px; }

.score-verdict {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  transition: color 0.3s ease;
}

.score-verdict.pop { animation: verdictPop 0.35s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes verdictPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.score-sub {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--text3);
  letter-spacing: 0.04em;
}

/* GLOBAL PROGRESS BAR */
.global-progress {
  max-width: 1280px;
  margin: 0 auto;
  padding: 12px 0 14px;
}

.progress-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.progress-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--text3);
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  gap: 6px;
}

.autosave-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  opacity: 0;
  transition: opacity 0.3s;
}
.autosave-dot.pulsing { opacity: 1; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.save-status-pill {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.05em;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--green-soft);
  color: var(--green);
  opacity: 0;
  transition: opacity 0.4s;
}
.save-status-pill.show { opacity: 1; }

.progress-count {
  font-family: 'Syne', sans-serif;
  font-size: 0.8rem;
  color: var(--text2);
  transition: color var(--transition);
}

.progress-bar-track {
  height: 5px;
  background: var(--bg4);
  border-radius: 99px;
  overflow: hidden;
  transition: background var(--transition);
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--c2), var(--green));
  border-radius: 99px;
  transition: width 0.5s ease;
  width: 0%;
}

/* SECTION TABS */
.tabs-outer {
  position: sticky;
  top: var(--header-h, 120px);
  z-index: 90;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  transition: background var(--transition), border-color var(--transition);
}

.tabs-scroll {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs-scroll::-webkit-scrollbar { display: none; }

.tab-btn {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 14px;
  border: none;
  background: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  color: var(--text3);
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  white-space: nowrap;
  position: relative;
}

.tab-btn.active {
  color: var(--text);
  font-weight: 600;
}

.tab-counter {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 99px;
  background: var(--bg4);
  color: var(--text3);
  transition: background 0.2s, color 0.2s;
}
.tab-btn.active .tab-counter { color: var(--text); background: var(--bg3); }
.tab-btn.complete .tab-counter { background: var(--green-soft); color: var(--green); }

/* MAIN CONTENT */
.main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 28px 24px 120px;
}

.section-panel { display: none; }
.section-panel.active { display: block; }

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  transition: border-color var(--transition);
}

.section-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}

.section-title-wrap { flex: 1; }

.section-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: -0.01em;
  transition: color var(--transition);
}

.section-subtitle {
  font-size: 0.78rem;
  color: var(--text3);
  margin-top: 2px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.03em;
}

.section-progress-badge {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  padding: 4px 10px;
  border-radius: 99px;
  flex-shrink: 0;
}

/* QUESTION CARD */
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: background var(--transition), border-color var(--transition), box-shadow 0.2s;
}
.q-card:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.15); }
.q-card.asked { border-color: var(--green); }
[data-theme="light"] .q-card.asked { border-color: var(--green); }

.q-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px;
  cursor: pointer;
}

.q-checkbox-wrap { padding-top: 2px; flex-shrink: 0; }
.q-checkbox {
  width: 20px; height: 20px;
  border-radius: 6px;
  border: 2px solid var(--border2);
  background: var(--bg3);
  appearance: none;
  cursor: pointer;
  position: relative;
  transition: border-color 0.2s, background 0.2s;
  flex-shrink: 0;
}
.q-checkbox:checked {
  background: var(--green);
  border-color: var(--green);
}
.q-checkbox:checked::after {
  content: '';
  position: absolute;
  top: 3px; left: 6px;
  width: 5px; height: 9px;
  border: 2px solid #fff;
  border-top: none; border-left: none;
  transform: rotate(45deg);
}

.q-body { flex: 1; min-width: 0; }

.q-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.q-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--text3);
  letter-spacing: 0.06em;
}

.q-type-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  padding: 2px 8px;
  border-radius: 99px;
  letter-spacing: 0.04em;
  font-weight: 500;
}
.q-type-tag.open { background: rgba(59,130,246,0.15); color: #3b82f6; }
.q-type-tag.closed { background: rgba(236,72,153,0.12); color: #ec4899; }
.q-type-tag.mixed { background: rgba(245,158,11,0.12); color: var(--amber); }
[data-theme="light"] .q-type-tag.open { background: rgba(37,99,235,0.1); color: #2563eb; }
[data-theme="light"] .q-type-tag.closed { background: rgba(219,39,119,0.1); color: #db2777; }
[data-theme="light"] .q-type-tag.mixed { background: rgba(217,119,6,0.1); color: #d97706; }

.q-topic-tag {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--bg4);
  color: var(--text3);
  letter-spacing: 0.03em;
}

.q-text {
  font-size: 0.92rem;
  color: var(--text);
  line-height: 1.55;
  transition: color var(--transition);
}

.q-expand-btn {
  margin-left: auto;
  flex-shrink: 0;
  padding-top: 2px;
  color: var(--text3);
  font-size: 0.75rem;
  user-select: none;
  transition: color 0.2s;
}

.q-body-lower {
  padding: 0 16px 16px;
  display: none;
}
.q-body-lower.open { display: block; }

/* HINTS TOGGLE */
.hints-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  margin-bottom: 10px;
  user-select: none;
}
.hints-toggle-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--violet);
  letter-spacing: 0.05em;
  font-weight: 500;
}
.hints-mini-bar-wrap {
  flex: 1;
  height: 4px;
  background: var(--bg4);
  border-radius: 99px;
  overflow: hidden;
  max-width: 80px;
}
.hints-mini-bar { height: 100%; background: var(--violet); border-radius: 99px; transition: width 0.3s ease; width: 0%; }
.hints-mini-count {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--text3);
}
.hints-chevron { font-size: 0.65rem; color: var(--text3); transition: transform 0.2s; }
.hints-chevron.open { transform: rotate(180deg); }

.hints-panel { display: none; margin-bottom: 12px; }
.hints-panel.open { display: block; }

.hint-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  transition: border-color var(--transition);
}
.hint-item:last-child { border-bottom: none; }

.hint-cb {
  width: 16px; height: 16px;
  border-radius: 4px;
  border: 2px solid var(--border2);
  background: var(--bg3);
  appearance: none;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  margin-top: 2px;
  transition: border-color 0.2s, background 0.2s;
}
.hint-cb:checked { background: var(--violet); border-color: var(--violet); }
.hint-cb:checked::after {
  content: '';
  position: absolute;
  top: 1px; left: 4px;
  width: 4px; height: 7px;
  border: 2px solid #fff;
  border-top: none; border-left: none;
  transform: rotate(45deg);
}

.hint-text {
  font-size: 0.82rem;
  color: var(--text2);
  line-height: 1.5;
  transition: color var(--transition);
}
.hint-text b { color: var(--text); font-weight: 600; }

/* NOTES */
.notes-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--text3);
  letter-spacing: 0.06em;
  margin-bottom: 5px;
  display: block;
}
.notes-area {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  padding: 10px 12px;
  resize: vertical;
  min-height: 70px;
  outline: none;
  transition: border-color 0.2s, background var(--transition), color var(--transition);
}
.notes-area:focus { border-color: var(--violet); }
.notes-area::placeholder { color: var(--text3); }

/* BOTTOM TOOLBAR */
.bottom-toolbar {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  display: flex;
  gap: 10px;
}

.toolbar-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 11px 18px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.2);
}
.toolbar-btn:hover { background: var(--bg4); transform: translateY(-2px); }
.toolbar-btn.primary { background: var(--violet); border-color: var(--violet); color: #fff; }
.toolbar-btn.primary:hover { background: #7c3aed; }

/* MODAL */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(3px);
}
.modal-backdrop.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px;
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  transition: background var(--transition), border-color var(--transition);
}

.modal-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  margin-bottom: 18px;
}

.modal-input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  padding: 10px 14px;
  outline: none;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.modal-input:focus { border-color: var(--violet); }

.modal-actions { display: flex; gap: 10px; margin-top: 6px; }
.modal-btn {
  flex: 1;
  padding: 10px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.84rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
}
.modal-btn:hover { background: var(--bg4); }
.modal-btn.primary { background: var(--violet); border-color: var(--violet); color: #fff; }
.modal-btn.primary:hover { background: #7c3aed; }
.modal-btn.danger { background: var(--red-dim); border-color: var(--red); color: var(--red); }
.modal-btn.danger:hover { background: var(--red); color: #fff; }

.session-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.session-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 9px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.session-item:hover { border-color: var(--violet); }
.session-item-info { flex: 1; min-width: 0; }
.session-item-name {
  font-weight: 500;
  font-size: 0.85rem;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-item-ts {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  color: var(--text3);
  margin-top: 2px;
  letter-spacing: 0.03em;
}
.session-del-btn {
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  font-size: 0.85rem;
  padding: 4px;
  border-radius: 4px;
  transition: color 0.2s;
}
.session-del-btn:hover { color: var(--red); }

.modal-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 16px 0;
}

.modal-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  color: var(--text3);
  letter-spacing: 0.06em;
  margin-bottom: 8px;
  display: block;
}

/* RESPONSIVE */
@media (max-width: 640px) {
  .header-inner { gap: 10px; padding: 12px 0 0; }
  .header-title { font-size: 1rem; }
  .main { padding: 16px 14px 110px; }
  .tabs-scroll { padding: 0 14px; }
  .bottom-toolbar { bottom: 16px; right: 14px; gap: 8px; }
  .toolbar-btn { padding: 9px 14px; font-size: 0.78rem; }
  .score-widget { padding: 7px 10px; }
  .score-ring-wrap { width: 44px; height: 44px; }
  .score-pct { font-size: 0.75rem; }

      { type:'closed', topic:'DR Runbooks', text:'Are your disaster recovery runbooks automated, version-controlled, and regularly tested, or are they primarily manual documentation?', hints:['Best practice: runbooks stored in <b>version control (Git)</b> alongside infrastructure code','Automation levels: <b>fully automated</b> (e.g. AWS SSM, Azure Automation) vs guided manual steps','Regular testing: runbooks executed in <b>quarterly DR drills</b> or as part of chaos experiments','Runbooks should have <b>expected outcomes and time estimates</b> per step','Integration with <b>on-call tooling</b> (PagerDuty runbooks, OpsGenie action plans)','Common gap: runbooks exist but are <b>out of date</b> because they\'re not tested regularly'] },
      { type:'open', topic:'DR Backup Strategy', text:'How would you design and validate a backup strategy that satisfies both RPO requirements and compliance data retention obligations?', hints:['Map <b>RPO per data tier</b>: transactional data vs logs vs analytics may have different RPOs','Backup types: <b>incremental, differential, full snapshots</b>, and continuous log shipping','Encryption and <b>immutability</b>: backups should be protected from ransomware and deletion','Cross-region backup replication for <b>geographic redundancy</b>','Regular <b>restore drills</b>: actually restore and validate data integrity, don\'t just backup','Compliance overlap: <b>GDPR retention limits</b>, financial data archival requirements'] },

      { type:'open', topic:'DR Test Approach', text:'What is your philosophy on DR test frequency and scope, and how do you prevent DR tests from becoming stale or purely theoretical?', hints:['<b>Continuous DR testing</b>: small, frequent experiments vs big annual drills that drift from reality','Progressive scope: start with <b>component-level</b> DR tests, build to full regional failover drills','Inject DR scenarios as part of <b>game days</b> with cross-functional teams present','Maintain a <b>DR test evidence log</b> for audit and compliance purposes','Avoid "checkbox" DR: test the <b>actual procedure people would follow</b> under pressure','Use <b>chaos engineering tools</b> (Gremlin, LitmusChaos) for automated, repeatable DR validation'] },
      { type:'closed', topic:'DR Network Redundancy', text:'Does your network architecture have redundancy at every layer (ISP, DNS, CDN, peering) to prevent network SPOFs from causing DR scenarios?', hints:['<b>Multi-ISP redundancy</b> or cloud-native network redundancy via multiple AZs/regions','<b>Anycast DNS</b> providers (Cloudflare, Route53) with health-check-driven failover','CDN in front of origin to absorb DDoS and serve cached content during origin failure','<b>BGP redundancy</b> and failover for hybrid or on-prem connected architectures','Testing: use chaos to <b>black-hole network paths</b> and validate automatic rerouting','Awareness of <b>DNS TTL settings</b> as a recovery speed bottleneck during failover'] },
      { type:'open', topic:'DR Runbooks', text:'Describe how you would create a runbook for an on-call engineer who has never handled a specific failure mode before and must resolve it at 3am.', hints:['Start with a clear <b>decision tree</b>: confirm symptoms → confirm blast radius → choose path','Use <b>screenshots, expected output, and copy-paste commands</b> — no ambiguity','Define explicit <b>escalation triggers</b>: when to page the architect or team lead','Link to relevant <b>dashboards and log queries</b> directly in the runbook','Include a <b>rollback step</b> if the remediation causes unexpected side effects','Validate via <b>dry-run</b> with a new team member before the runbook is considered complete'] },

// ============================================================
// STATE
// ============================================================
let state = {
  activeSection: 0,
  asked: {},     // qid -> bool
  hints: {},     // qid_hIdx -> bool
  notes: {},     // qid -> string
};

let autosaveTimer = null;
let lastVerdict = '';

// ============================================================
// DOM BUILDING
// ============================================================
function buildUI() {
  buildTabs();
  buildSections();
  updateAllCounters();
}

function qid(sIdx, qIdx) { return `s${sIdx}q${qIdx}`; }

function buildTabs() {
  const tabsScroll = document.getElementById('tabsScroll');
  SECTIONS.forEach((sec, sIdx) => {
    const btn = document.createElement('button');
    btn.className = `tab-btn sec-${sIdx}`;
    btn.id = `tab-${sIdx}`;
    btn.onclick = () => switchSection(sIdx);
    btn.innerHTML = `${sec.icon} <span>${sec.title}</span> <span class="tab-counter" id="tab-counter-${sIdx}">0/10</span>`;
    tabsScroll.appendChild(btn);
  });
}

function buildSections() {
  const main = document.getElementById('mainContent');
  SECTIONS.forEach((sec, sIdx) => {
    const panel = document.createElement('div');
    panel.className = `section-panel sec-${sIdx}${sIdx === 0 ? ' active' : ''}`;
    panel.id = `section-${sIdx}`;

    panel.innerHTML = `
      <div class="section-header">
        <div class="section-icon">${sec.icon}</div>
        <div class="section-title-wrap">
          <div class="section-title">${sec.title}</div>
          <div class="section-subtitle">AREA ${sIdx + 1} OF ${SECTIONS.length} · ${sec.questions.length} QUESTIONS</div>
        </div>
        <div class="section-progress-badge" id="sec-badge-${sIdx}">0 / ${sec.questions.length} asked</div>
      </div>
      <div id="sec-questions-${sIdx}"></div>
    `;

    const qContainer = panel.querySelector(`#sec-questions-${sIdx}`);
    sec.questions.forEach((q, qIdx) => {
      qContainer.appendChild(buildQuestionCard(sIdx, qIdx, q));
    });

    main.appendChild(panel);
  });
}

function buildQuestionCard(sIdx, qIdx, q) {
  const id = qid(sIdx, qIdx);
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `card-${id}`;

  const typeClass = q.type === 'open' ? 'open' : q.type === 'closed' ? 'closed' : 'mixed';
  const typeLabel = q.type === 'open' ? 'OPEN' : q.type === 'closed' ? 'CLOSED' : 'MIXED';

  const hintsHtml = q.hints.map((hint, hIdx) => `
    <div class="hint-item">
      <input type="checkbox" class="hint-cb" id="hint-${id}-${hIdx}" onchange="onHintChange('${id}', ${hIdx}, ${q.hints.length})">
      <label class="hint-text" for="hint-${id}-${hIdx}">${hint}</label>
    </div>
  `).join('');

  card.innerHTML = `
    <div class="q-header" onclick="toggleCard('${id}')">
      <div class="q-checkbox-wrap" onclick="event.stopPropagation()">
        <input type="checkbox" class="q-checkbox" id="qcb-${id}" onchange="onAskedChange('${id}', ${sIdx})">
      </div>
      <div class="q-body">
        <div class="q-meta">
          <span class="q-num">Q${qIdx + 1}</span>
          <span class="q-type-tag ${typeClass}">${typeLabel}</span>
          <span class="q-topic-tag">${q.topic}</span>
        </div>
        <div class="q-text">${q.text}</div>
      </div>
      <div class="q-expand-btn" id="expand-${id}">▼</div>
    </div>
    <div class="q-body-lower" id="lower-${id}">
      <div class="hints-toggle" onclick="toggleHints('${id}', ${q.hints.length})">
        <span class="hints-toggle-label">💡 ANSWER HINTS</span>
        <div class="hints-mini-bar-wrap">
          <div class="hints-mini-bar" id="hmb-${id}"></div>
        </div>
        <span class="hints-mini-count" id="hmc-${id}">0/${q.hints.length}</span>
        <span class="hints-chevron" id="hchev-${id}">▼</span>
      </div>
      <div class="hints-panel" id="hp-${id}">${hintsHtml}</div>
      <div>
        <span class="notes-label">INTERVIEWER NOTES</span>
        <textarea class="notes-area" id="notes-${id}" placeholder="Record observations, quotes, follow-ups…" oninput="onNotesChange('${id}')"></textarea>
      </div>
    </div>
  `;

  return card;
}

// ============================================================
// INTERACTIONS
// ============================================================
function switchSection(sIdx) {
  document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`section-${sIdx}`).classList.add('active');
  document.getElementById(`tab-${sIdx}`).classList.add('active');
  state.activeSection = sIdx;
  document.getElementById(`tab-${sIdx}`).scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function toggleCard(id) {
  const lower = document.getElementById(`lower-${id}`);
  const expand = document.getElementById(`expand-${id}`);
  const isOpen = lower.classList.contains('open');
  lower.classList.toggle('open', !isOpen);
  expand.textContent = isOpen ? '▼' : '▲';
}

function toggleHints(id, total) {
  const panel = document.getElementById(`hp-${id}`);
  const chev = document.getElementById(`hchev-${id}`);
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

function onAskedChange(id, sIdx) {
  const cb = document.getElementById(`qcb-${id}`);
  state.asked[id] = cb.checked;
  const card = document.getElementById(`card-${id}`);
  card.classList.toggle('asked', cb.checked);
  updateAllCounters();
  scheduleAutosave();
}

function onHintChange(id, hIdx, total) {
  const key = `${id}_${hIdx}`;
  const cb = document.getElementById(`hint-${id}-${hIdx}`);
  state.hints[key] = cb.checked;
  updateHintBar(id, total);
  updateScore();
  scheduleAutosave();
}

function onNotesChange(id) {
  const ta = document.getElementById(`notes-${id}`);
  state.notes[id] = ta.value;
  scheduleAutosave();
}

function updateHintBar(id, total) {
  let count = 0;
  for (let i = 0; i < total; i++) {
    if (state.hints[`${id}_${i}`]) count++;
  }
  const pct = total > 0 ? (count / total * 100) : 0;
  document.getElementById(`hmb-${id}`).style.width = pct + '%';
  document.getElementById(`hmc-${id}`).textContent = `${count}/${total}`;
}

function updateAllCounters() {
  let totalAsked = 0;
  const totalQ = SECTIONS.reduce((s, sec) => s + sec.questions.length, 0);

  SECTIONS.forEach((sec, sIdx) => {
    let secAsked = 0;
    sec.questions.forEach((q, qIdx) => {
      if (state.asked[qid(sIdx, qIdx)]) secAsked++;
    });
    totalAsked += secAsked;
    const counter = document.getElementById(`tab-counter-${sIdx}`);
    const badge = document.getElementById(`sec-badge-${sIdx}`);
    const tab = document.getElementById(`tab-${sIdx}`);
    const done = secAsked === sec.questions.length;
    counter.textContent = done ? '✓' : `${secAsked}/${sec.questions.length}`;
    tab.classList.toggle('complete', done);
    if (badge) badge.textContent = `${secAsked} / ${sec.questions.length} asked`;
  });

  document.getElementById('globalProgressCount').textContent = `${totalAsked} / ${totalQ}`;
  document.getElementById('globalProgressBar').style.width = (totalAsked / totalQ * 100) + '%';
  updateScore();
}

function updateScore() {
  let totalHints = 0, coveredHints = 0;
  SECTIONS.forEach((sec, sIdx) => {
    sec.questions.forEach((q, qIdx) => {
      const id = qid(sIdx, qIdx);
      totalHints += q.hints.length;
      q.hints.forEach((h, hIdx) => {
        if (state.hints[`${id}_${hIdx}`]) coveredHints++;
      });
    });
  });

  const pct = totalHints > 0 ? Math.round(coveredHints / totalHints * 100) : 0;
  const circumference = 2 * Math.PI * 22;
  const dashoffset = circumference - (pct / 100) * circumference;

  document.getElementById('scorePct').textContent = pct + '%';
  document.getElementById('scoreSub').textContent = `${coveredHints} / ${totalHints} hints`;

  const ring = document.getElementById('scoreRingFg');
  const verdict = document.getElementById('scoreVerdict');
  let colour, verdictText;
  if (pct < 40) { colour = '#ef4444'; verdictText = 'No Hire'; }
  else if (pct < 70) { colour = '#f59e0b'; verdictText = 'Can Consider'; }
  else { colour = '#22c55e'; verdictText = 'Sure Hire ✓'; }

  ring.style.stroke = colour;
  ring.style.strokeDashoffset = dashoffset;
  verdict.style.color = colour;

  if (verdictText !== lastVerdict) {
    verdict.classList.remove('pop');
    void verdict.offsetWidth;
    verdict.classList.add('pop');
    lastVerdict = verdictText;
  }
  verdict.textContent = verdictText;
}

// ============================================================
// THEME
// ============================================================
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
}

function initTheme() {
  const saved = localStorage.getItem('theme');
  const preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', saved || preferred);
}

// ============================================================
// AUTOSAVE
// ============================================================
function scheduleAutosave() {
  const dot = document.getElementById('autosaveDot');
  dot.classList.add('pulsing');
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    doAutosave();
    dot.classList.remove('pulsing');
  }, 1500);
}

function doAutosave() {
  const data = { state, ts: new Date().toISOString(), name: '__autosave__' };
  localStorage.setItem('resilience_autosave', JSON.stringify(data));
  const pill = document.getElementById('saveStatusPill');
  pill.textContent = 'Auto-saved';
  pill.classList.add('show');
  setTimeout(() => pill.classList.remove('show'), 2500);
}

function loadAutosave() {
  const raw = localStorage.getItem('resilience_autosave');
  if (raw) {
    try {
      const data = JSON.parse(raw);
      applyState(data.state);
    } catch(e) {}
  }
}

// ============================================================
// STATE APPLY
// ============================================================
function applyState(s) {
  state.asked = s.asked || {};
  state.hints = s.hints || {};
  state.notes = s.notes || {};

  SECTIONS.forEach((sec, sIdx) => {
    sec.questions.forEach((q, qIdx) => {
      const id = qid(sIdx, qIdx);
      const cbEl = document.getElementById(`qcb-${id}`);
      if (cbEl) {
        cbEl.checked = !!state.asked[id];
        document.getElementById(`card-${id}`).classList.toggle('asked', !!state.asked[id]);
      }
      q.hints.forEach((h, hIdx) => {
        const hEl = document.getElementById(`hint-${id}-${hIdx}`);
        if (hEl) hEl.checked = !!state.hints[`${id}_${hIdx}`];
      });
      updateHintBar(id, q.hints.length);
      const notesEl = document.getElementById(`notes-${id}`);
      if (notesEl) notesEl.value = state.notes[id] || '';
    });
  });
  updateAllCounters();
}

  document.getElementById(id).classList.remove('open');
}

document.querySelectorAll('.modal-backdrop').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

function populateSaveModal() {
  const sessions = getSessions();
  const list = document.getElementById('saveSessionList');
  list.innerHTML = '';
  if (sessions.length === 0) {
    document.getElementById('existingSessionsWrap').style.display = 'none';
    return;
  }
  document.getElementById('existingSessionsWrap').style.display = '';
  sessions.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'session-item';
    item.innerHTML = `
      <div class="session-item-info" onclick="prefillSaveName('${s.name.replace(/'/g,"\\'")}')">
        <div class="session-item-name">${s.name}</div>
        <div class="session-item-ts">${new Date(s.ts).toLocaleString()}</div>
      </div>
      <button class="session-del-btn" onclick="deleteSession(${i})">✕</button>
    `;
    list.appendChild(item);
  });
}

function prefillSaveName(name) {
  document.getElementById('saveNameInput').value = name;
}

function saveNamedSession() {
  const name = document.getElementById('saveNameInput').value.trim();
  if (!name) { alert('Please enter a session name.'); return; }
  const sessions = getSessions();
  const existing = sessions.findIndex(s => s.name === name);
  const entry = { name, state: JSON.parse(JSON.stringify(state)), ts: new Date().toISOString() };
  if (existing >= 0) sessions[existing] = entry;
  else sessions.push(entry);
  setSessions(sessions);
  const pill = document.getElementById('saveStatusPill');
  pill.textContent = `Saved: ${name}`;
  pill.classList.add('show');
  setTimeout(() => pill.classList.remove('show'), 3000);
  closeModal('saveModal');
}

function deleteSession(i) {
  const sessions = getSessions();
  sessions.splice(i, 1);
  setSessions(sessions);
  populateSaveModal();
}

function populateLoadModal() {
  const sessions = getSessions();
  const list = document.getElementById('loadSessionList');
  list.innerHTML = '';

  const autosave = localStorage.getItem('resilience_autosave');
  if (autosave) {
    const as = JSON.parse(autosave);
    const item = createSessionLoadItem('⚡ Auto-save', as.ts, () => { applyState(as.state); closeModal('loadModal'); });
    list.appendChild(item);
  }

  if (sessions.length === 0 && !autosave) {
    list.innerHTML = '<div style="color:var(--text3);font-size:0.82rem;padding:8px 0">No saved sessions found.</div>';
    return;
  }
  sessions.forEach(s => {
    const item = createSessionLoadItem(s.name, s.ts, () => { applyState(s.state); closeModal('loadModal'); });
    list.appendChild(item);
  });
}

function createSessionLoadItem(name, ts, onClick) {
  const item = document.createElement('div');
  item.className = 'session-item';
  item.innerHTML = `
    <div class="session-item-info">
      <div class="session-item-name">${name}</div>
      <div class="session-item-ts">${new Date(ts).toLocaleString()}</div>
    </div>
    <span style="color:var(--text3);font-size:0.75rem">Load →</span>
  `;
  item.onclick = onClick;
  return item;
}

function importSession(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.state) { applyState(data.state); closeModal('loadModal'); }
      else { alert('Invalid session file.'); }
    } catch(err) { alert('Could not parse JSON file.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============================================================
// EXPORT
// ============================================================
function getVerdict(pct) {
  if (pct < 40) return 'No Hire';
  if (pct < 70) return 'Can Consider';
  return 'Sure Hire ✓';
}

function exportTxt() {
  const sessionName = (() => {
    const raw = localStorage.getItem('resilience_autosave');
    if (raw) { try { const d = JSON.parse(raw); return d.name || 'Untitled Session'; } catch(e){} }
    return 'Untitled Session';
  })();

  let totalHints = 0, coveredHints = 0;
  SECTIONS.forEach((sec, sIdx) => {
    sec.questions.forEach((q, qIdx) => {
      const id = qid(sIdx, qIdx);
      totalHints += q.hints.length;
      q.hints.forEach((h, hIdx) => { if (state.hints[`${id}_${hIdx}`]) coveredHints++; });
    });
  });
  const pct = totalHints > 0 ? Math.round(coveredHints / totalHints * 100) : 0;
  const verdict = getVerdict(pct);

  let lines = [];
  lines.push('═══════════════════════════════════════════════════════════════');
  lines.push('  RESILIENCE TEST ENGINEER — INTERVIEW EXPORT');
  lines.push('═══════════════════════════════════════════════════════════════');
  lines.push(`  Session : ${sessionName}`);
  lines.push(`  Exported: ${new Date().toLocaleString()}`);
  lines.push(`  Score   : ${pct}% (${coveredHints}/${totalHints} hints covered)`);
  lines.push(`  Verdict : ${verdict}`);
  lines.push('═══════════════════════════════════════════════════════════════\n');

  SECTIONS.forEach((sec, sIdx) => {
    lines.push(`\n▌ AREA ${sIdx + 1}: ${sec.title.toUpperCase()}`);
    lines.push('─'.repeat(60));
    sec.questions.forEach((q, qIdx) => {
      const id = qid(sIdx, qIdx);
      const asked = state.asked[id] ? '[ASKED]' : '[SKIP ]';
      lines.push(`\n  ${asked} Q${qIdx + 1}. [${q.type.toUpperCase()}] ${q.text}`);
      lines.push(`         Topic: ${q.topic}`);
      lines.push('         Hints:');
      q.hints.forEach((hint, hIdx) => {
        const covered = state.hints[`${id}_${hIdx}`] ? '✓' : '○';
        const clean = hint.replace(/<[^>]+>/g, '');
        lines.push(`           ${covered} ${clean}`);
      });
      const notes = state.notes[id];
      if (notes && notes.trim()) {
        lines.push('         Notes:');
        notes.split('\n').forEach(l => lines.push(`           ${l}`));
      }
    });
  });

  lines.push('\n═══════════════════════════════════════════════════════════════');
  lines.push(`  FINAL SCORE: ${pct}% — ${verdict}`);
  lines.push('═══════════════════════════════════════════════════════════════\n');

  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `resilience-interview-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

window.addEventListener('DOMContentLoaded', () => {
  initTheme();
  buildUI();
  loadAutosave();
  switchSection(0);

  // set header height for tab sticky offset
  const header = document.getElementById('appHeader');
  const tabs = document.getElementById('tabsOuter');
  const obs = new ResizeObserver(() => {
    tabs.style.top = header.offsetHeight + 'px';
  });
  obs.observe(header);
});
</script>
