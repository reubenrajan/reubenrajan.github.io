  {
    id:'exception-handling', title:'Exception & Error Handling', icon:'⚠️',
    questions:[
      { type:'open', topic:'Retry Strategy', text:'Describe the design decisions behind a production-safe retry strategy for a payment processing service, and explain how you would validate it does not make an outage worse during a recovery scenario.', hints:['Distinguish retryable errors: transient 503/429 vs permanent 400/401/403 — retrying permanent errors wastes time', 'Exponential backoff with jitter: prevents <b>thundering herd</b> when many clients retry simultaneously after shared failure', 'Max retry attempts and total timeout: bound the retry window to prevent silent hanging past RTO', 'Idempotency: payment retries must be idempotent — <b>idempotency key</b> prevents double-charges on retry', 'Thundering herd test: restart the payment service, observe incoming retry rate curve — should be spread, not spiked', 'Validate with chaos: inject 50% transient errors and measure whether the retry strategy achieves eventual success rate'] },
      { type:'closed', topic:'Distributed Tracing', text:'Do your application traces include the context needed to diagnose an intermittent error that only occurs in production under concurrent load — and can you give an example of a bug you found this way?', hints:['Traces must include: <b>trace ID, span ID, service name, endpoint, error type, relevant business context</b>', 'Concurrent-load bugs are often invisible at low traffic — high cardinality trace sampling is required to catch them', 'Example: a race condition in a shared resource appeared only at P99 concurrency — visible only in traces with parallel spans', 'Tooling: <b>Datadog APM, Dynatrace distributed tracing</b> — both support filtering by error status and sorting by duration', 'Context: traces should carry business identifiers (user ID, order ID, payment ID) for faster diagnosis', 'Strong answer: candidate describes a specific bug found via trace analysis, not just generic description of tooling'] },
      { type:'open', topic:'Graceful Degradation', text:'Walk me through how you design and test a graceful degradation path for a non-critical feature that shares infrastructure with a critical user journey.', hints:['Identify the dependency boundary: the non-critical feature must be isolatable without affecting the critical journey', 'Implementation: try/catch with explicit fallback, <b>feature flag killswitch</b>, or circuit breaker on the non-critical path', 'Test: disable the non-critical dependency via chaos injection and verify critical journey completes successfully', 'Observe: is the degradation visible to users? is there a clear indicator that the feature is unavailable?', 'Logging and alerting: degradation should produce a log and alert — not silent failure that no one notices', 'Recovery test: re-enable dependency and verify feature restores without application restart'] },
      { type:'mixed', topic:'Retry Storms', text:'Describe a retry storm scenario you have witnessed or can describe in detail — what causes one, how does it manifest in observability data, and what architectural controls prevent recurrence?', hints:['Retry storm: mass client retry at the same interval after a shared failure → recovering service receives burst 10x normal load', 'Manifestation: error rate spike → service recovery → immediate new error spike from retry burst → oscillation', 'Observability: incoming request rate spikes sharply as upstream service recovers — visible in APM traffic graphs', 'Root cause: no jitter in retry intervals, or retry triggered too quickly relative to recovery time', 'Prevention: exponential backoff with random jitter, <b>circuit breaker</b> to stop retries when circuit is open', 'Architecture: push retries to a <b>queue</b> rather than in-process — decouple retry rate from recovery rate'] },
      { type:'open', topic:'Error Classification', text:'How do you instrument and classify application errors to ensure that every error type is either handled gracefully, alerted on correctly, or explicitly documented as acceptable?', hints:['Error taxonomy: <b>expected errors</b> (validation, auth) vs <b>transient errors</b> (timeouts, 503s) vs <b>unexpected errors</b> (bugs, panics)', 'Expected errors: handle cleanly, no alert needed, count as a metric for anomaly detection', 'Transient errors: retry eligible, count toward error budget, alert if rate exceeds baseline', 'Unexpected errors: immediate alert, always logged with full context, treated as incidents', 'Implementation: structured error types in application code, mapped to alert severity in observability tool', 'Audit: review unclassified errors in observability — any "unknown" error category is a gap'] },
      { type:'closed', topic:'Exception Observability', text:'Can every exception that occurs in your production system be traced back to the specific request, user, and code path that caused it — and how was that observability built?', hints:['<b>OpenTelemetry</b> trace context injected into every exception log — links exception to originating trace', 'Exception aggregation: <b>Sentry-style error grouping</b> or Datadog Error Tracking — groups similar exceptions', 'Stack traces include: exception type, message, code location, and correlated trace ID', 'User context: if regulations permit, user ID or session hash in trace context accelerates diagnosis', 'Build: OTel auto-instrumentation for most exceptions, manual span events for business-critical catch blocks', 'Gap test: deliberately trigger a specific exception and verify it appears in observability with full context within 60 seconds'] },
      { type:'open', topic:'Bulkhead Validation', text:'Describe how you would use a combination of load testing and fault injection to validate that a bulkhead pattern correctly prevents a batch workload from starving an interactive user workload.', hints:['Setup: configure separate thread pools (or K8s resource quotas) for batch vs interactive paths', 'Load test: drive batch workload to 100% of its allocated pool while simultaneously driving interactive traffic', 'Expected outcome: interactive requests experience no degradation despite batch pool saturation', 'Fault inject: exhaust the batch pool further and verify isolation holds under extreme batch load', 'Measure: P95/P99 latency for interactive requests throughout the test — must stay within SLO', 'Failure signal: if interactive latency degrades during batch saturation, the bulkhead is not correctly implemented'] },
      { type:'mixed', topic:'OpenTelemetry Implementation', text:'You are asked to instrument a new service with OpenTelemetry so that traces, logs, and metrics are all correlated in Datadog. Walk me through the implementation decisions and the tests you would run to confirm correct instrumentation.', hints:['SDK choice: auto-instrumentation agent vs manual SDK — auto covers most frameworks, manual for custom business logic', 'Trace context propagation: <b>W3C TraceContext headers</b> must be forwarded on every outbound HTTP call', 'Log correlation: inject trace ID and span ID into structured log output using OTel log bridge API', 'Custom spans: wrap critical business operations (payment processing, inventory reservation) in explicit spans', 'Test: trigger a known multi-service transaction and verify <b>end-to-end trace appears in Datadog</b> with all service spans', 'Test: trigger an error and verify exception appears as a span event with full context, linked to the originating trace'] },
      { type:'closed', topic:'Feature Flags as Safety', text:'Have you specifically tested a feature flag rollback path under load — i.e. toggling a flag off while the feature is actively being used by traffic — and what behaviour did you observe?', hints:['In-flight requests at the moment of flag change: do they complete under the old or new code path?', 'Flag propagation: SDK-based flags update per-request; server-restart flags are slower — know your model', 'Test: toggle flag off while 100 concurrent users are using the feature — observe error rate and latency', 'Expected: zero errors during flag toggle if implementation correctly checks flag per request', 'Unexpected but common: cached flag values cause some requests to continue on old path after toggle', 'Strong answer: candidate describes the specific propagation mechanism and has measured its latency'] },
      { type:'open', topic:'Error Budget Impact', text:'How do you decide which error types should consume error budget and which should not, and how does this classification affect the alerts and SLO burn rate calculations?', hints:['Budget-consuming errors: any error that represents <b>a failure the user experiences</b> (5xx, timeouts, data corruption)', 'Non-budget errors: expected errors (auth failures, validation rejections) — these are not service failures', 'Classification matters: if every 400 consumes budget, SLO burns fast on client errors that the service handles correctly', 'Implementation: SLI denominator = total requests; numerator = requests resulting in budget-consuming errors only', 'Alert calibration: burn rate alerts keyed to budget-consuming error rate, not total error rate', 'Review: quarterly review of error classification — does the taxonomy still reflect user experience accurately?'] },

  {
    id:'resilience-testing', title:'Resilience Testing Approach & Maturity', icon:'🔬',
    questions:[
      { type:'open', topic:'Chaos Engineering Philosophy', text:'Beyond the mechanics of fault injection, explain what chaos engineering is conceptually attempting to prove, and describe how you would distinguish a team that is "doing chaos" from one that is genuinely building resilience.', hints:['Conceptual goal: <b>build confidence</b> that the system behaves correctly under conditions it will eventually face in production', 'Not just breaking things: chaos engineering is hypothesis-driven — define expected behaviour before injecting', 'Teams doing chaos superficially: run experiments, find nothing, declare success — no learning, no improvements', 'Teams building resilience: every experiment either <b>confirms confidence or produces a finding</b> — both are valid outcomes', 'Genuine maturity: experiments are connected to SLOs, findings create backlog items, improvements are re-tested', 'Distinguish: ad hoc game days vs <b>continuous chaos integrated into deployment pipelines</b>'] },

// STATE
// ═══════════════════════════════════════════════════════════════
let state = { activeSection:0, asked:{}, hints:{}, notes:{} };
let autosaveTimer = null;
let lastVerdict = '';
let sidebarCollapsed = false;

function qid(s,q){ return `s${s}q${q}`; }

// ═══════════════════════════════════════════════════════════════
// BUILD UI
// ═══════════════════════════════════════════════════════════════
function buildUI(){
  buildNav();
  buildSections();
  updateAll();
}

function buildNav(){
  const list = document.getElementById('navList');
  SECTIONS.forEach((sec,si)=>{
    const wrap = document.createElement('div');

    const item = document.createElement('div');
    item.className = `nav-item s${si}${si===0?' active':''}`;
    item.id = `nav-${si}`;
    item.onclick = ()=>switchSection(si);
    item.innerHTML = `
      <div class="nav-icon">${sec.icon}</div>
      <div class="nav-text-wrap">
        <span class="nav-title">${sec.title}</span>
      </div>
      <span class="nav-counter" id="nc-${si}">0/10</span>
    `;

    const prog = document.createElement('div');
    prog.className = 'nav-prog';
    prog.innerHTML = `<div class="nav-prog-fill s${si}" id="np-${si}" style="width:0%"></div>`;

    wrap.appendChild(item);
    wrap.appendChild(prog);
    list.appendChild(wrap);
  });
}

function buildSections(){
  const main = document.getElementById('mainContent');
  SECTIONS.forEach((sec,si)=>{
    const panel = document.createElement('div');
    panel.className = `section-panel s${si}${si===0?' active':''}`;
    panel.id = `sp-${si}`;
    panel.innerHTML = `
      <div class="sec-hdr">
        <div class="sec-icon s${si}">${sec.icon}</div>
        <div class="sec-title-wrap">
          <div class="sec-title s${si}">${sec.title}</div>
          <div class="sec-meta">AREA ${si+1} OF ${SECTIONS.length} · ${sec.questions.length} QUESTIONS</div>
        </div>
        <div class="sec-badge s${si}" id="sb-${si}">0 / ${sec.questions.length} asked</div>
      </div>
      <div id="sq-${si}"></div>
    `;
    const qc = panel.querySelector(`#sq-${si}`);
    sec.questions.forEach((q,qi)=> qc.appendChild(buildCard(si,qi,q)));
    main.appendChild(panel);
  });
}

function buildCard(si,qi,q){
  const id = qid(si,qi);
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `card-${id}`;

  const tc = q.type==='open'?'open':q.type==='closed'?'closed':'mixed';
  const tl = q.type==='open'?'OPEN':q.type==='closed'?'CLOSED':'MIXED';

  const hintsHtml = q.hints.map((h,hi)=>`
    <div class="hint-row">
      <input type="checkbox" class="hint-cb" id="hcb-${id}-${hi}" onchange="onHint('${id}',${hi},${q.hints.length})">
      <label class="hint-text" for="hcb-${id}-${hi}">${h}</label>
    </div>
  `).join('');

  card.innerHTML = `
    <div class="q-hdr" onclick="toggleCard('${id}')">
      <div class="q-cb-wrap" onclick="event.stopPropagation()">
        <input type="checkbox" class="q-cb" id="qcb-${id}" onchange="onAsked('${id}',${si})">
      </div>
      <div class="q-body">
        <div class="q-meta">
          <span class="q-num">Q${qi+1}</span>
          <span class="q-type ${tc}">${tl}</span>
          <span class="q-topic">${q.topic}</span>
        </div>
        <div class="q-text">${q.text}</div>
      </div>
      <div class="q-expand" id="qexp-${id}">▼</div>
    </div>
    <div class="q-lower" id="ql-${id}">
      <div class="hints-row" onclick="toggleHints('${id}',${q.hints.length})">
        <span class="hints-label">💡 ANSWER HINTS</span>
        <div class="hmb-track"><div class="hmb-fill" id="hmb-${id}"></div></div>
        <span class="hmc" id="hmc-${id}">0/${q.hints.length}</span>
        <span class="hchev" id="hchev-${id}">▼</span>
      </div>
      <div class="hints-panel" id="hp-${id}">${hintsHtml}</div>
      <span class="notes-lbl">INTERVIEWER NOTES</span>
      <textarea class="notes-ta" id="nta-${id}" placeholder="Record candidate observations, quotes, and follow-ups…" oninput="onNotes('${id}')"></textarea>
    </div>
  `;
  return card;
}

// ═══════════════════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════════════════
function switchSection(si){
  document.querySelectorAll('.section-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById(`sp-${si}`).classList.add('active');
  document.getElementById(`nav-${si}`).classList.add('active');
  state.activeSection = si;
  // on mobile, close sidebar after selection
  if(window.innerWidth<=768) document.getElementById('sidebar').classList.remove('mob-open');
}

function toggleCard(id){
  const lower = document.getElementById(`ql-${id}`);
  const exp = document.getElementById(`qexp-${id}`);
  const open = lower.classList.toggle('open');
  exp.textContent = open ? '▲' : '▼';
}

function toggleHints(id,total){
  const panel = document.getElementById(`hp-${id}`);
  const chev = document.getElementById(`hchev-${id}`);
  const open = panel.classList.toggle('open');
  chev.classList.toggle('open',open);
}

function onAsked(id,si){
  const cb = document.getElementById(`qcb-${id}`);
  state.asked[id] = cb.checked;
  document.getElementById(`card-${id}`).classList.toggle('asked',cb.checked);
  updateAll();
  scheduleAutosave();
}

function onHint(id,hi,total){
  state.hints[`${id}_${hi}`] = document.getElementById(`hcb-${id}-${hi}`).checked;
  updateHintBar(id,total);
  updateScore();
  scheduleAutosave();
}

function onNotes(id){
  state.notes[id] = document.getElementById(`nta-${id}`).value;
  scheduleAutosave();
}

function updateHintBar(id,total){
  let count=0;
  for(let i=0;i<total;i++) if(state.hints[`${id}_${i}`]) count++;
  const pct = total>0 ? count/total*100 : 0;
  document.getElementById(`hmb-${id}`).style.width = pct+'%';
  document.getElementById(`hmc-${id}`).textContent = `${count}/${total}`;
}

function updateAll(){
  let totalAsked=0;
  const totalQ = SECTIONS.reduce((s,sec)=>s+sec.questions.length,0);

  SECTIONS.forEach((sec,si)=>{
    let asked=0;
    sec.questions.forEach((_,qi)=>{ if(state.asked[qid(si,qi)]) asked++; });
    totalAsked += asked;
    const pct = sec.questions.length>0 ? asked/sec.questions.length*100 : 0;
    const done = asked===sec.questions.length;
    const nc = document.getElementById(`nc-${si}`);
    const np = document.getElementById(`np-${si}`);
    const sb = document.getElementById(`sb-${si}`);
    const ni = document.getElementById(`nav-${si}`);
    if(nc) nc.textContent = done ? '✓' : `${asked}/${sec.questions.length}`;
    if(np) np.style.width = pct+'%';
    if(sb) sb.textContent = `${asked} / ${sec.questions.length} asked`;
    if(ni) ni.classList.toggle('complete',done);
  });

  document.getElementById('gCount').textContent = `${totalAsked} / ${totalQ}`;
  document.getElementById('gBar').style.width = (totalAsked/totalQ*100)+'%';
  updateScore();
}

function updateScore(){
  let total=0,covered=0;
  SECTIONS.forEach((sec,si)=>{
    sec.questions.forEach((q,qi)=>{
      const id=qid(si,qi);
      total+=q.hints.length;
      q.hints.forEach((_,hi)=>{ if(state.hints[`${id}_${hi}`]) covered++; });
    });
  });
  const pct = total>0 ? Math.round(covered/total*100) : 0;
  const circ = 2*Math.PI*19; // r=19
  const offset = circ - (pct/100)*circ;

  document.getElementById('ringPct').textContent = pct+'%';
  document.getElementById('verdictSub').textContent = `${covered} / ${total} hints`;

  const ring = document.getElementById('ringFg');
  const verd = document.getElementById('verdict');
  let colour, text;
  if(pct<40){colour='#ef4444';text='No Hire';}
  else if(pct<70){colour='#f59e0b';text='Can Consider';}
  else{colour='#22c55e';text='Sure Hire ✓';}

  ring.style.stroke = colour;
  ring.style.strokeDashoffset = offset;
  verd.style.color = colour;
  if(text!==lastVerdict){
    verd.classList.remove('pop');
    void verd.offsetWidth;
    verd.classList.add('pop');
    lastVerdict=text;
  }
  verd.textContent = text;
}

  if(window.innerWidth<=768){
    document.getElementById('sidebar').classList.toggle('mob-open');

    sidebarCollapsed = !sidebarCollapsed;
    document.getElementById('sidebar').classList.toggle('collapsed',sidebarCollapsed);

// THEME
// ═══════════════════════════════════════════════════════════════
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
}
function initTheme(){
  const saved = localStorage.getItem('theme');
  const pref = window.matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme',saved||pref);
}

// ═══════════════════════════════════════════════════════════════
// AUTOSAVE
// ═══════════════════════════════════════════════════════════════
function scheduleAutosave(){
  const dot = document.getElementById('autosaveDot');
  dot.classList.add('pulsing');
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=>{
    doAutosave();
    dot.classList.remove('pulsing');
  },1500);
}
function doAutosave(){
  localStorage.setItem('resilience_autosave', JSON.stringify({state,ts:new Date().toISOString()}));
  const pill = document.getElementById('savePill');
  pill.textContent='Auto-saved';
  pill.classList.add('show');
  setTimeout(()=>pill.classList.remove('show'),2500);
}
function loadAutosave(){
  const raw = localStorage.getItem('resilience_autosave');
  if(raw){ try{ applyState(JSON.parse(raw).state); }catch(e){} }
}

// ═══════════════════════════════════════════════════════════════
// STATE APPLY
// ═══════════════════════════════════════════════════════════════
function applyState(s){
  state.asked = s.asked||{};
  state.hints = s.hints||{};
  state.notes = s.notes||{};
  SECTIONS.forEach((sec,si)=>{
    sec.questions.forEach((q,qi)=>{
      const id=qid(si,qi);
      const cb=document.getElementById(`qcb-${id}`);
      if(cb){ cb.checked=!!state.asked[id]; document.getElementById(`card-${id}`).classList.toggle('asked',!!state.asked[id]); }
      q.hints.forEach((_,hi)=>{ const hEl=document.getElementById(`hcb-${id}-${hi}`); if(hEl) hEl.checked=!!state.hints[`${id}_${hi}`]; });
      updateHintBar(id,q.hints.length);
      const ta=document.getElementById(`nta-${id}`);
      if(ta) ta.value=state.notes[id]||'';
    });
  });
  updateAll();
}

}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-bd').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('open'); }));

function populateSaveModal(){
  const sessions=getSessions(), list=document.getElementById('saveList');
  list.innerHTML='';
  const wrap=document.getElementById('existWrap');
  if(!sessions.length){ wrap.style.display='none'; return; }
  wrap.style.display='';
  sessions.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='sess-item';
    el.innerHTML=`<div class="sess-info" onclick="document.getElementById('saveNameInput').value='${s.name.replace(/'/g,"\\'")}'"><div class="sess-name">${s.name}</div><div class="sess-ts">${new Date(s.ts).toLocaleString()}</div></div><button class="sess-del" onclick="delSession(${i})">✕</button>`;
    list.appendChild(el);
  });
}

function saveSession(){
  const name=document.getElementById('saveNameInput').value.trim();
  if(!name){ alert('Please enter a session name.'); return; }
  const sessions=getSessions();
  const idx=sessions.findIndex(s=>s.name===name);
  const entry={name,state:JSON.parse(JSON.stringify(state)),ts:new Date().toISOString()};
  if(idx>=0) sessions[idx]=entry; else sessions.push(entry);
  setSessions(sessions);
  const pill=document.getElementById('savePill');
  pill.textContent=`Saved: ${name}`; pill.classList.add('show');
  setTimeout(()=>pill.classList.remove('show'),3000);
  closeModal('saveMod');
}

function delSession(i){
  const s=getSessions(); s.splice(i,1); setSessions(s); populateSaveModal();
}

function populateLoadModal(){
  const sessions=getSessions(), list=document.getElementById('loadList');
  list.innerHTML='';
  const as=localStorage.getItem('resilience_autosave');
  if(as){ const d=JSON.parse(as); list.appendChild(mkLoadItem('⚡ Auto-save',d.ts,()=>{ applyState(d.state); closeModal('loadMod'); })); }
  if(!sessions.length&&!as){ list.innerHTML='<div style="color:var(--text3);font-size:.82rem;padding:8px 0">No saved sessions found.</div>'; return; }
  sessions.forEach(s=>list.appendChild(mkLoadItem(s.name,s.ts,()=>{ applyState(s.state); closeModal('loadMod'); })));
}

function mkLoadItem(name,ts,fn){
  const el=document.createElement('div'); el.className='sess-item';
  el.innerHTML=`<div class="sess-info"><div class="sess-name">${name}</div><div class="sess-ts">${new Date(ts).toLocaleString()}</div></div><span style="color:var(--text3);font-size:.73rem">Load →</span>`;
  el.onclick=fn; return el;
}

function importSession(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{ try{ const d=JSON.parse(ev.target.result); if(d.state){ applyState(d.state); closeModal('loadMod'); } else alert('Invalid session file.'); }catch(err){ alert('Could not parse JSON.'); } };
  r.readAsText(file); e.target.value='';
}

// ═══════════════════════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════════════════════
function exportTxt(){
  let total=0,covered=0;
  SECTIONS.forEach((sec,si)=>sec.questions.forEach((q,qi)=>{ const id=qid(si,qi); total+=q.hints.length; q.hints.forEach((_,hi)=>{ if(state.hints[`${id}_${hi}`]) covered++; }); }));
  const pct=total>0?Math.round(covered/total*100):0;
  const verdict=pct<40?'No Hire':pct<70?'Can Consider':'Sure Hire ✓';

  const lines=['═'.repeat(65),'  RESILIENCE TEST ENGINEER — INTERVIEW EXPORT','═'.repeat(65),
    `  Exported : ${new Date().toLocaleString()}`,
    `  Score    : ${pct}% (${covered}/${total} hints covered)`,
    `  Verdict  : ${verdict}`,'═'.repeat(65)];

  SECTIONS.forEach((sec,si)=>{
    lines.push(`\n▌ AREA ${si+1}: ${sec.title.toUpperCase()}`,'─'.repeat(60));
    sec.questions.forEach((q,qi)=>{
      const id=qid(si,qi);
      lines.push(`\n  ${state.asked[id]?'[ASKED]':'[SKIP ]'} Q${qi+1}. [${q.type.toUpperCase()}] ${q.text}`,`         Topic: ${q.topic}`,'         Hints:');
      q.hints.forEach((h,hi)=>lines.push(`           ${state.hints[`${id}_${hi}`]?'✓':'○'} ${h.replace(/<[^>]+>/g,'')}`));
      const n=state.notes[id]; if(n&&n.trim()){ lines.push('         Notes:'); n.split('\n').forEach(l=>lines.push(`           ${l}`)); }
    });
  });
  lines.push('\n'+'═'.repeat(65),`  FINAL SCORE: ${pct}% — ${verdict}`,'═'.repeat(65));

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));
  a.download=`resilience-interview-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

    const h=hdr.offsetHeight;
    sidebar.style.top=h+'px';
    sidebar.style.height=`calc(100vh - ${h}px)`;

  ro.observe(hdr);
