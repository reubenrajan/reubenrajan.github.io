
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resilience Test Engineer — Interview Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root {
  --bg:      #0b0d12;
  --bg2:     #10131a;
  --bg3:     #161b26;
  --bg4:     #1d2333;
  --surface: #1a1f2e;
  --sur2:    #212840;
  --border:  #272e45;
  --bor2:    #323d5c;
  --text:    #e4e8f4;
  --text2:   #8e97b8;
  --text3:   #545d7e;
  --green:   #22c55e;
  --amber:   #f59e0b;
  --red:     #ef4444;
  --violet:  #8b5cf6;
  --vsof:    rgba(139,92,246,.14);
  --gsof:    rgba(34,197,94,.11);
  --tr:      0.25s ease;
  --sidebar: 256px;

  --c0: #22c55e;
  --c1: #3b82f6;
  --c2: #f59e0b;
  --c3: #ec4899;
  --c4: #8b5cf6;
  --c5: #06b6d4;
  --c6: #f97316;
  --c7: #a3e635;
  --c8: #e879f9;
}
[data-theme="light"] {
  --bg:      #f1f3fa;
  --bg2:     #e8eaf4;
  --bg3:     #dde1f0;
  --bg4:     #d0d5ea;
  --surface: #ffffff;
  --sur2:    #f4f5fc;
  --border:  #c6cce0;
  --bor2:    #adb5d2;
  --text:    #0f1420;
  --text2:   #374166;
  --text3:   #6b748f;
  --green:   #16a34a;
  --amber:   #d97706;
  --red:     #dc2626;
  --violet:  #7c3aed;
  --vsof:    rgba(124,58,237,.10);
  --gsof:    rgba(22,163,74,.10);
  --c0: #16a34a; --c1: #2563eb; --c2: #d97706; --c3: #db2777;
  --c4: #7c3aed; --c5: #0891b2; --c6: #ea580c; --c7: #65a30d; --c8: #c026d3;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
  transition:background var(--tr),color var(--tr);
  font-size:14.5px;line-height:1.65;
  display:flex;flex-direction:column;
}

/* ── HEADER ─────────────────────────────────────────────────── */
.hdr{
  position:sticky;top:0;z-index:200;
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 20px;
  transition:background var(--tr),border-color var(--tr);
}
.hdr-inner{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:13px 0;
}
.hdr-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.sidebar-toggle{
  width:32px;height:32px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;cursor:pointer;flex-shrink:0;
  transition:background var(--tr),border-color var(--tr);
}
.sidebar-toggle:hover{background:var(--bg4)}
.sidebar-toggle span{
  display:block;width:14px;height:1.5px;background:var(--text2);border-radius:2px;
  transition:background var(--tr);
}
.hdr-title{
  font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;
  color:var(--text);letter-spacing:-.02em;white-space:nowrap;
  transition:color var(--tr);
}
.hdr-sub{
  font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text3);
  letter-spacing:.06em;display:block;margin-top:1px;
}
.hdr-right{display:flex;align-items:center;gap:16px;flex-shrink:0}

/* progress strip */
.hdr-progress{
  display:flex;align-items:center;gap:10px;
  padding:0 16px;border-right:1px solid var(--border);
}
.prog-label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text3);letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.autosave-dot{width:6px;height:6px;border-radius:50%;background:var(--green);opacity:0;transition:opacity .3s}
.autosave-dot.pulsing{opacity:1;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.save-pill{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.04em;
  padding:2px 8px;border-radius:99px;
  background:var(--gsof);color:var(--green);
  opacity:0;transition:opacity .4s;white-space:nowrap;
}
.save-pill.show{opacity:1}
.hdr-prog-bar-track{width:120px;height:4px;background:var(--bg4);border-radius:99px;overflow:hidden}
.hdr-prog-bar-fill{height:100%;background:linear-gradient(90deg,var(--c1),var(--green));border-radius:99px;transition:width .5s ease;width:0}
.prog-count{font-family:'Syne',sans-serif;font-size:.78rem;color:var(--text2);white-space:nowrap}

/* score widget */
.score-widget{display:flex;align-items:center;gap:10px;border-left:1px solid var(--border);padding-left:16px}
.ring-wrap{position:relative;width:46px;height:46px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bor2);stroke-width:4;transition:stroke var(--tr)}
.ring-fg{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:119;stroke-dashoffset:119;transition:stroke-dashoffset .6s ease,stroke .4s ease}
.ring-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Syne',sans-serif;font-weight:700;font-size:.75rem;color:var(--text)}
.score-info{display:flex;flex-direction:column;gap:1px}
.verdict{font-family:'Syne',sans-serif;font-weight:700;font-size:.82rem;transition:color .3s}
.verdict.pop{animation:vpop .35s cubic-bezier(.175,.885,.32,1.275)}
@keyframes vpop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.verdict-sub{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text3);letter-spacing:.04em}

/* theme toggle */
.theme-toggle{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.tgl-pill{
  width:40px;height:22px;background:var(--bg4);border-radius:11px;
  border:1px solid var(--bor2);position:relative;cursor:pointer;
  transition:background var(--tr),border-color var(--tr);
}
.tgl-pill::after{
  content:'';position:absolute;width:16px;height:16px;border-radius:50%;
  background:var(--text3);top:2px;left:2px;
  transition:transform .25s ease,background .25s ease;
}
[data-theme="light"] .tgl-pill::after{transform:translateX(18px);background:var(--c4)}
.tgl-icon{font-size:.85rem}

/* ── LAYOUT ─────────────────────────────────────────────────── */
.app-body{
  display:flex;flex:1;min-height:0;
  position:relative;
}

/* ── SIDEBAR ─────────────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar);
  flex-shrink:0;
  background:var(--bg2);
  border-right:1px solid var(--border);
  position:sticky;
  top:57px; /* header height */
  height:calc(100vh - 57px);
  overflow-y:auto;
  overflow-x:hidden;
  transition:width var(--tr),background var(--tr),border-color var(--tr);
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}
.sidebar.collapsed{width:56px}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.sidebar-label{
  font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text3);
  letter-spacing:.1em;padding:16px 16px 6px;white-space:nowrap;
  transition:opacity var(--tr),padding var(--tr);
}
.sidebar.collapsed .sidebar-label{opacity:0;padding:16px 0 6px}

.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;
  cursor:pointer;
  border-left:3px solid transparent;
  transition:background .2s,border-color .2s,padding var(--tr);
  position:relative;
  white-space:nowrap;
  overflow:hidden;
}
.sidebar.collapsed .nav-item{padding:11px 0;justify-content:center}
.nav-item:hover{background:var(--bg3)}
.nav-item.active{border-left-color:var(--sc,var(--c1));background:var(--bg4)}
.sidebar.collapsed .nav-item.active{border-left-color:transparent;border-left:3px solid var(--sc,var(--c1))}

.nav-icon{
  font-size:1rem;flex-shrink:0;
  width:28px;height:28px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--sc,#6b7280) 15%,transparent);
  transition:background var(--tr);
}

.nav-text-wrap{flex:1;min-width:0;overflow:hidden}
.nav-title{
  font-family:'DM Sans',sans-serif;font-weight:500;font-size:.78rem;
  color:var(--text2);display:block;
  overflow:hidden;text-overflow:ellipsis;
  transition:color .2s,opacity var(--tr),max-width var(--tr);
}
.sidebar.collapsed .nav-title{opacity:0;max-width:0}
.nav-item.active .nav-title{color:var(--text)}

.nav-counter{
  font-family:'DM Mono',monospace;font-size:.6rem;
  padding:2px 6px;border-radius:99px;
  background:var(--bg3);color:var(--text3);
  flex-shrink:0;
  transition:background .2s,color .2s,opacity var(--tr);
}
.sidebar.collapsed .nav-counter{opacity:0}
.nav-item.complete .nav-counter{background:var(--gsof);color:var(--green)}

/* sidebar section progress bar */
.nav-prog{
  height:2px;background:var(--bg4);margin:0 14px 2px;border-radius:99px;overflow:hidden;
  transition:margin var(--tr);
}
.sidebar.collapsed .nav-prog{margin:0 8px 2px}
.nav-prog-fill{height:100%;border-radius:99px;background:var(--sc,var(--c1));transition:width .4s ease}

/* ── MAIN ─────────────────────────────────────────────────────── */
.main{
  flex:1;min-width:0;
  padding:28px 32px 120px;
  transition:padding var(--tr);
}
@media(max-width:1024px){.main{padding:20px 20px 120px}}

.section-panel{display:none}
.section-panel.active{display:block}

.sec-hdr{
  display:flex;align-items:flex-start;gap:14px;
  margin-bottom:22px;padding-bottom:18px;
  border-bottom:1px solid var(--border);
}
.sec-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;
  background:color-mix(in srgb,var(--sc) 14%,transparent);
}
.sec-title-wrap{flex:1}
.sec-title{
  font-family:'Syne',sans-serif;font-weight:700;font-size:1.2rem;
  color:var(--sc);letter-spacing:-.01em;
}
.sec-meta{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text3);letter-spacing:.04em;margin-top:3px}
.sec-badge{
  font-family:'DM Mono',monospace;font-size:.68rem;
  padding:5px 12px;border-radius:99px;flex-shrink:0;margin-top:2px;
  border:1px solid color-mix(in srgb,var(--sc) 30%,transparent);
  background:color-mix(in srgb,var(--sc) 10%,transparent);
  color:var(--sc);
}

/* ── QUESTION CARD ───────────────────────────────────────────── */
.q-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;margin-bottom:10px;overflow:hidden;
  transition:background var(--tr),border-color var(--tr),box-shadow .2s;
}
.q-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.18)}
.q-card.asked{border-color:var(--green)}

.q-hdr{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;cursor:pointer;
}
.q-cb-wrap{padding-top:2px;flex-shrink:0}
.q-cb{
  width:19px;height:19px;border-radius:6px;
  border:2px solid var(--bor2);background:var(--bg3);
  appearance:none;cursor:pointer;position:relative;
  transition:border-color .2s,background .2s;flex-shrink:0;
}
.q-cb:checked{background:var(--green);border-color:var(--green)}
.q-cb:checked::after{
  content:'';position:absolute;top:2px;left:5px;
  width:5px;height:9px;border:2px solid #fff;
  border-top:none;border-left:none;transform:rotate(45deg);
}

.q-body{flex:1;min-width:0}
.q-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.q-num{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--text3);letter-spacing:.06em}
.q-type{
  font-family:'DM Mono',monospace;font-size:.6rem;
  padding:2px 7px;border-radius:99px;letter-spacing:.04em;font-weight:500;
}
.q-type.open  {background:rgba(59,130,246,.13);color:#5b9cf7}
.q-type.closed{background:rgba(236,72,153,.11);color:#f472b6}
.q-type.mixed {background:rgba(245,158,11,.11);color:var(--amber)}
[data-theme="light"] .q-type.open  {background:rgba(37,99,235,.09);color:#1d4ed8}
[data-theme="light"] .q-type.closed{background:rgba(219,39,119,.09);color:#be185d}
[data-theme="light"] .q-type.mixed {background:rgba(217,119,6,.09);color:#b45309}
.q-topic{
  font-family:'DM Mono',monospace;font-size:.6rem;
  padding:2px 7px;border-radius:99px;
  background:var(--bg4);color:var(--text3);
}
.q-text{font-size:.9rem;color:var(--text);line-height:1.6;transition:color var(--tr)}
.q-expand{margin-left:auto;color:var(--text3);font-size:.7rem;padding-top:2px;flex-shrink:0;user-select:none}

.q-lower{padding:0 16px 16px;display:none}
.q-lower.open{display:block}

/* hints */
.hints-row{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  margin-bottom:10px;user-select:none;
}
.hints-label{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--violet);letter-spacing:.05em;font-weight:500}
.hmb-track{flex:1;max-width:80px;height:3px;background:var(--bg4);border-radius:99px;overflow:hidden}
.hmb-fill{height:100%;background:var(--violet);border-radius:99px;transition:width .3s ease;width:0}
.hmc{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--text3)}
.hchev{font-size:.6rem;color:var(--text3);transition:transform .2s}
.hchev.open{transform:rotate(180deg)}

.hints-panel{display:none;margin-bottom:14px;background:var(--vsof);border-radius:9px;padding:4px 0;border:1px solid rgba(139,92,246,.15)}
.hints-panel.open{display:block}
[data-theme="light"] .hints-panel{background:var(--vsof);border-color:rgba(124,58,237,.12)}

.hint-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:8px 12px;
  border-bottom:1px solid rgba(139,92,246,.1);
}
.hint-row:last-child{border-bottom:none}
.hint-cb{
  width:15px;height:15px;border-radius:4px;
  border:2px solid var(--bor2);background:var(--bg3);
  appearance:none;cursor:pointer;position:relative;
  flex-shrink:0;margin-top:2px;
  transition:border-color .2s,background .2s;
}
.hint-cb:checked{background:var(--violet);border-color:var(--violet)}
.hint-cb:checked::after{
  content:'';position:absolute;top:0px;left:3px;
  width:4px;height:8px;border:2px solid #fff;
  border-top:none;border-left:none;transform:rotate(45deg);
}
.hint-text{font-size:.81rem;color:var(--text2);line-height:1.55;transition:color var(--tr)}
.hint-text b{color:var(--text);font-weight:600}

/* notes */
.notes-lbl{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--text3);letter-spacing:.06em;display:block;margin-bottom:5px}
.notes-ta{
  width:100%;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:.82rem;padding:9px 12px;resize:vertical;min-height:68px;
  outline:none;transition:border-color .2s,background var(--tr),color var(--tr);
}
.notes-ta:focus{border-color:var(--violet)}
.notes-ta::placeholder{color:var(--text3)}

/* ── BOTTOM TOOLBAR ──────────────────────────────────────────── */
.btoolbar{
  position:fixed;bottom:20px;right:24px;z-index:300;
  display:flex;gap:8px;
}
.tbtn{
  display:flex;align-items:center;gap:6px;
  padding:10px 16px;border-radius:10px;
  border:1px solid var(--border);background:var(--sur2);
  color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:.8rem;font-weight:500;cursor:pointer;
  transition:background .2s,transform .15s,border-color .2s;
  box-shadow:0 4px 20px rgba(0,0,0,.25);backdrop-filter:blur(8px);
}
.tbtn:hover{background:var(--bg4);transform:translateY(-2px)}
.tbtn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.tbtn.primary:hover{background:#7c3aed}

/* ── MODALS ──────────────────────────────────────────────────── */
.modal-bd{
  position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:400;
  display:none;align-items:center;justify-content:center;
  padding:20px;backdrop-filter:blur(4px);
}
.modal-bd.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:26px;width:100%;max-width:500px;
  max-height:80vh;overflow-y:auto;
  transition:background var(--tr),border-color var(--tr);
}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem;margin-bottom:16px}
.modal-input{
  width:100%;background:var(--bg2);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:.86rem;padding:9px 13px;outline:none;margin-bottom:12px;
  transition:border-color .2s;
}
.modal-input:focus{border-color:var(--violet)}
.modal-actions{display:flex;gap:8px;margin-top:6px}
.mbtn{
  flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:.82rem;font-weight:500;cursor:pointer;transition:background .2s;
}
.mbtn:hover{background:var(--bg4)}
.mbtn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.mbtn.primary:hover{background:#7c3aed}
.mbtn.danger{background:rgba(239,68,68,.08);border-color:var(--red);color:var(--red)}
.mbtn.danger:hover{background:var(--red);color:#fff}
.session-list{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.sess-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 13px;background:var(--bg2);
  border:1px solid var(--border);border-radius:8px;
  cursor:pointer;transition:border-color .2s;
}
.sess-item:hover{border-color:var(--violet)}
.sess-info{flex:1;min-width:0}
.sess-name{font-weight:500;font-size:.83rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-ts{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text3);margin-top:1px}
.sess-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:.82rem;padding:3px;border-radius:4px;transition:color .2s}
.sess-del:hover{color:var(--red)}
.modal-div{border:none;border-top:1px solid var(--border);margin:14px 0}
.modal-lbl{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text3);letter-spacing:.06em;display:block;margin-bottom:7px}
.import-wrap{position:relative}
.import-file{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

/* ── SECTION COLOUR UTILITIES ────────────────────────────────── */
.s0{--sc:var(--c0)} .s1{--sc:var(--c1)} .s2{--sc:var(--c2)} .s3{--sc:var(--c3)}
.s4{--sc:var(--c4)} .s5{--sc:var(--c5)} .s6{--sc:var(--c6)} .s7{--sc:var(--c7)} .s8{--sc:var(--c8)}

/* ── RESPONSIVE ──────────────────────────────────────────────── */
@media(max-width:768px){
  .sidebar{position:fixed;top:57px;left:0;height:calc(100vh - 57px);z-index:150;transform:translateX(-100%);transition:transform var(--tr),background var(--tr)}
  .sidebar.mob-open{transform:translateX(0)}
  .sidebar.collapsed{width:var(--sidebar);transform:translateX(-100%)}
  .hdr-prog-bar-track{width:80px}
  .main{padding:16px 14px 110px}
  .btoolbar{right:14px;bottom:14px;gap:6px}
  .tbtn{padding:9px 13px;font-size:.76rem}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr" id="appHdr">
  <div class="hdr-inner">
    <div class="hdr-left">
      <div class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="Toggle sidebar">
        <span></span><span></span><span></span>
      </div>
      <div>
        <div class="hdr-title">Resilience Test Engineer</div>
        <span class="hdr-sub">INTERVIEW QUESTIONNAIRE · 9 AREAS · 90 QUESTIONS</span>
      </div>
    </div>
    <div class="hdr-right">
      <div class="hdr-progress">
        <div class="prog-label">
          <div class="autosave-dot" id="autosaveDot"></div>
          PROGRESS
          <div class="save-pill" id="savePill">Saved</div>
        </div>
        <div class="hdr-prog-bar-track"><div class="hdr-prog-bar-fill" id="gBar"></div></div>

const SECTIONS = [
  {
    id:'reliability-metrics', title:'Reliability Targets & Metrics', icon:'🎯',
    questions:[
      { type:'open', topic:'RTO & RPO', text:'In your experience, how have you translated a business continuity requirement (e.g. "we cannot lose more than 15 minutes of orders") into a concrete RTO and RPO, and then written test cases that falsify those targets?', hints:['Distinguish <b>RTO (max tolerable downtime)</b> from <b>RPO (max tolerable data loss)</b> precisely', 'Describe working with product and finance to derive numbers — not just taking SRE defaults', 'Explain how RPO drives backup/replication frequency and RTO drives runbook step-timing budgets', 'Describe actual test: controlled failover, clock the steps, compare measured time against target', 'Mention verifying <b>data delta</b> at moment of failover as the RPO validation mechanism', 'Discuss what happens when a test <b>fails</b> the target — escalation, architecture change, re-test'] },
      { type:'closed', topic:'Availability SLAs', text:'Have you ever inherited a system whose stated SLA was "99.9% availability" but had no measurement mechanism to prove it — and if so, what did you do?', hints:['Expect a "yes" from experienced candidates with a concrete remediation story', 'Identify the gap: SLA as a contract vs SLI as the measurable signal feeding it', 'Describe instrumenting a meaningful <b>availability SLI</b> (not just ping, but transaction success rate)', 'Reference tooling chosen: <b>Datadog Synthetics, Dynatrace SLO module</b>, or custom metric pipelines', 'Explain how they socialised the real baseline vs the claimed SLA with leadership', 'Note whether a remediation plan or architecture change followed the measurement gap discovery'] },
      { type:'open', topic:'SLO & Error Budgets', text:'Explain how error budgets create a constructive tension between feature velocity and reliability, and describe a situation where you used an error budget to arbitrate a real engineering decision.', hints:['Correctly define: <b>error budget = 1 − SLO target</b>, representing allowable failure headroom', 'Explain the policy: budget exhausted → reliability work takes priority over feature work', 'Candidate should cite a <b>real trade-off moment</b>: a risky deployment held back, or a rollback triggered', 'Discuss burn rate alerting: fast burn signals imminent exhaustion before the period ends', 'Mention who owns the SLO — ideally the team that owns the service, not a central SRE gate', 'Strong answer: candidate mentions that error budgets also protect engineers from over-conservative release freezes'] },
      { type:'mixed', topic:'MTTx Metrics', text:'You are told MTTR for your highest-severity incidents is 47 minutes on average. Walk me through exactly how you would diagnose which part of the incident lifecycle is consuming the most time, and what tooling and process changes you would make.', hints:['Break MTTR into constituent phases: <b>MTTD → MTTI → MTTM → MTTR</b> (detect, investigate, mitigate, resolve)', 'Use alerting data to calculate MTTD — is detection happening via <b>monitor or customer complaint?</b>', 'Use incident tooling (PagerDuty timeline, Jira Service Management) to timestamp each phase', 'Identify the longest phase — usually investigation — and instrument richer context (traces, profiles) there', 'Propose specific fixes: pre-correlated dashboards, runbooks with copy-paste commands, chaos rehearsal', 'Measure again after changes — MTTR improvement should be demonstrable, not assumed'] },
      { type:'open', topic:'SLI Design', text:'Walk me through designing an SLI that genuinely reflects user experience for an asynchronous payment processing pipeline — not just infrastructure uptime.', hints:['Reject naive SLIs: CPU < 80% or service up/down do not reflect user experience for async flows', 'Propose a <b>request success ratio</b> at the business event level: payments completing within SLO window', 'Define the <b>measurement window</b>: per-minute rolling vs per-day batch vs real-time stream', 'Distinguish <b>availability SLI</b> (did it complete?) from <b>latency SLI</b> (did it complete in time?)', 'Discuss how to handle retried payments — count first attempt, final outcome, or both?', 'Note instrumentation challenge: async jobs need correlation IDs to tie trigger to completion metric'] },
      { type:'closed', topic:'RTO Validation', text:'Have you ever run a DR drill where the system failed to meet its documented RTO, and what were the root causes and outcomes?', hints:['A "yes" with specifics is a strong positive signal — vague answers suggest limited DR testing experience', 'Common root causes: runbook steps missed, manual approval gates, DNS TTL too high, cold replica lag', 'Outcome should include: immediate runbook fix, architectural remediation, scheduled re-test', 'Ask follow-up: was the RTO target revised, or the system fixed to meet the original target?', 'Strong candidate discusses making RTO tests <b>automated and repeatable</b>, not just one-off drills', 'Note whether they informed stakeholders proactively vs discovered at the next audit'] },
      { type:'open', topic:'Availability Measurement', text:'How do you avoid the trap of measuring availability at the infrastructure layer while users are actually experiencing failures at the application or business-logic layer?', hints:['Infrastructure availability (host up) != application availability (serving correct responses)', 'Instrument at the <b>user journey level</b> using synthetic transactions that mimic real flows', 'Use <b>real user monitoring (RUM)</b> alongside synthetics to catch issues only real users hit', 'Define availability in terms of <b>HTTP 2xx or business-event success rate</b>, not just port reachability', 'Reference tools: <b>Datadog Synthetics, Dynatrace browser monitors</b>, or custom canary services', 'Discuss the "invisible degradation" problem — partial failures that pass health checks but hurt users'] },
      { type:'mixed', topic:'SLO Compliance', text:'Your SLO dashboard shows you are at 99.4% availability against a 99.5% SLO target for the month. There are eight days left. How do you reason about risk and what actions do you take?', hints:['Calculate remaining error budget: 99.5% monthly = ~3.65 hrs allowed downtime; current state = budget mostly consumed', 'Current burn rate: 0.1% overage risk with 8 days left — any further incident tips into breach', 'Immediate action: implement a <b>deployment freeze</b> on high-risk changes for the remainder of the month', 'Escalate to engineering leadership with a clear budget-remaining narrative, not just raw percentages', 'Review upcoming changes: delay risky migrations, accelerate any in-flight reliability fixes', 'Plan a post-period retrospective regardless — why was the budget at risk in week 3?'] },
      { type:'open', topic:'MTTx Metrics', text:'Describe a monitoring and alerting design that would allow an on-call engineer to achieve a MTTD of under two minutes for a latency regression affecting 5% of users.', hints:['5% of users requires <b>percentile-based alerting</b>, not average — P95/P99 latency alerts', 'Set a <b>multi-window burn rate alert</b> that fires within 2 mins of regression onset', 'Alert must include immediate context: service, endpoint, error type, relevant dashboard link', 'Use <b>anomaly detection</b> (Datadog or Dynatrace AI) to distinguish regression from expected variance', 'Synthetic monitors from multiple regions catch geographically isolated regressions faster', 'Test the detection design: inject latency with chaos tooling and measure actual detection time'] },
      { type:'closed', topic:'Error Budgets', text:'Has your team ever formally stopped feature releases due to an error budget exhaustion, and how was that decision made and communicated?', hints:['This reveals whether the team has operational discipline or treats SLOs as decorative metrics', 'Strong answer: a clear policy existed, the trigger was automatic or semi-automatic, not ad hoc', 'Expect detail on: who made the call, how engineering and product were aligned on the policy in advance', 'Communication: status page, Slack announcement, stakeholder email — not just a verbal conversation', 'Candidate should describe what reliability work filled the freeze period', 'Weak answer: "we discussed it but kept releasing" — signals SLO culture immaturity'] },

  {
    id:'resilient-architecture', title:'Resilient Architecture', icon:'🏗️',
    questions:[
      { type:'open', topic:'Failure Mode Analysis', text:'You are reviewing the architecture of a new microservices system before go-live. Walk me through the structured process you would use to surface failure modes that the development team may not have considered.', hints:['Describe facilitating an <b>FMEA (Failure Mode and Effect Analysis)</b> workshop with devs, SRE, and architects', 'For each component: enumerate failure mode → effect on system → severity → likelihood → detectability', 'Classify by layer: compute, network, data, third-party dependency — each has distinct failure modes', 'Use existing post-mortems and incident history as a seed for the failure mode list', 'Output should be a prioritised risk register feeding a <b>chaos experiment backlog</b>, not just a document', 'Distinguish FMEA from threat modelling — FMEA is about accidental failures, not adversarial ones'] },
      { type:'closed', topic:'Single Points of Failure', text:'Have you ever identified a SPOF in a production system that the team believed was already highly available — and how did you discover and prove it?', hints:['Strong answers name a specific component type: shared message broker, DNS resolver, auth service, certificate authority', 'Discovery method matters: chaos test, dependency graph analysis, or an actual incident that revealed the hidden SPOF', 'Proof: demonstrated that failure of that component caused the "HA" system to fail end-to-end', 'Resolution: architecture change (redundancy, decoupling) or explicit risk acceptance with monitoring', 'Process change: SPOF check added to architecture review checklist going forward', 'Candidate should distinguish between <b>architectural SPOF</b> (design) and <b>operational SPOF</b> (config or runbook)'] },
      { type:'open', topic:'Multi-Region Design', text:'Explain the fundamental data consistency challenge in an active-active multi-region deployment and describe how you would test that your chosen consistency model holds under real failure conditions.', hints:['Active-active: both regions accept writes simultaneously — creates <b>write conflict risk</b>', 'Consistency models: <b>strong consistency</b> (slower, safe), <b>eventual consistency</b> (faster, requires conflict resolution)', 'CAP theorem context: under network partition, must choose consistency or availability', 'Test: inject a network partition between regions mid-write and observe: data loss? conflict? stale reads?', 'Validate conflict resolution strategy (last-write-wins, CRDT, custom merge) produces correct business outcome', 'Measure <b>replication lag</b> under load and define the threshold at which lag becomes a business problem'] },
      { type:'mixed', topic:'Dependency Failure', text:'Your service makes calls to five downstream APIs. Two are owned by third parties. How do you design and test your service to remain functional when any one of those five dependencies becomes unavailable?', hints:['Map each dependency: <b>critical path</b> (failure = user-facing error) vs <b>non-critical</b> (failure = degraded feature)', 'Implement <b>circuit breakers</b> per dependency — open circuit triggers a tested fallback path', '<b>Bulkheads</b>: separate thread pools or connection pools per dependency to contain cascade', 'For third-party APIs: implement <b>timeout, retry with backoff, and cached fallback response</b>', 'Test: disable each dependency in turn using Gremlin or LitmusChaos and verify correct degradation behaviour', 'Third-party dependencies: consider a <b>vendor SLA tracker</b> and contractual escalation path in your runbook'] },
      { type:'open', topic:'AZ Failure Handling', text:'Describe a time you tested or validated AZ-level fault tolerance. What did the test reveal, and how did the outcome change the architecture or configuration?', hints:['Concrete test: used chaos tooling or cloud console to drain/terminate all instances in one AZ', 'Observed: load balancer rerouting time, DB failover duration, cache rebalancing behaviour', 'A good answer surfaces a <b>gap discovered</b>: something that was assumed resilient but was not', 'Common findings: health check interval too long, connection pool not refreshed, sticky sessions surviving', 'Architecture change: moved to multi-AZ for a component that was single-AZ, or reduced TTLs', 'Operational change: added AZ-drain chaos test to regular game day or CI pipeline'] },
      { type:'closed', topic:'FMEA Practice', text:'Does your team integrate failure analysis (FMEA or equivalent) into the design review process, or is it only triggered after incidents?', hints:['Best-in-class teams do FMEA <b>before go-live</b> as a gate, not just retrospectively after failures', 'Expect honest reflection: many teams only do it reactively — candidate should acknowledge and describe the delta', 'Signs of mature practice: FMEA outputs live in the same backlog as feature work, not a separate risk register', 'Integration into design reviews: architecture decision records (ADRs) should include failure mode considerations', 'Weak answer: "we do post-mortems" — post-mortems are reactive, FMEA is proactive', 'Follow-up: how do you keep FMEA findings current as the system evolves rapidly?'] },
      { type:'open', topic:'Cascade Failure Prevention', text:'Explain the difference between a circuit breaker, a bulkhead, and a timeout in the context of cascade failure prevention — and describe how you would validate that all three are correctly tuned in a production-like environment.', hints:['<b>Timeout</b>: bounds how long a request waits — prevents thread/connection exhaustion from slow downstreams', '<b>Circuit breaker</b>: stops sending requests to a failing dependency — prevents cascade amplification', '<b>Bulkhead</b>: limits the blast radius of one dependency failure to its own resource pool', 'Validation approach: inject latency and error faults per dependency using Gremlin or LitmusChaos', 'Verify circuit opens at correct threshold and half-open state correctly probes recovery', 'Measure: does a single dependency fault cascade? — if yes, bulkheads or timeouts are misconfigured'] },
      { type:'mixed', topic:'Architecture Review', text:'You are asked to assess the resilience of a legacy monolithic application that the business depends on but cannot currently be refactored. What is your testing and risk mitigation approach?', hints:['Accept reality: full decomposition is not always possible — resilience must be applied to what exists', 'External resilience layers: <b>load balancer health checks, CDN caching, API gateway rate limiting</b>', 'Identify the monolith\'s own SPOFs: shared DB, shared config, single deployment unit', 'Testing: <b>load and performance tests</b> to find resource exhaustion thresholds before they hit production', 'Monitoring: instrument the monolith boundaries deeply — external HTTP calls, DB query times, thread pool saturation', 'Risk mitigation: <b>blue-green deployments</b> to reduce deployment risk; rollback runbook tested and timed'] },
      { type:'closed', topic:'Dependency Mapping', text:'Do you use automated tooling (e.g. service maps, dependency graphs) to maintain a current and accurate picture of your service dependencies, and how often does reality diverge from what the map shows?', hints:['<b>Datadog Service Map, Dynatrace SmartScape</b>, or AWS X-Ray service map for runtime dependency discovery', 'Runtime maps often reveal <b>undocumented dependencies</b> that no architecture diagram captured', 'Divergence is expected — the map is only as good as the instrumentation coverage', 'Discuss how undiscovered dependencies become SPOFs because they are not resilience-tested', 'Governance: map review should be part of <b>architecture review and pre-production sign-off</b>', 'Strong answer: candidate describes a specific undocumented dependency they found via APM that caused an incident'] },
      { type:'open', topic:'SPOF Prioritisation', text:'If a structured analysis surfaces twelve potential single points of failure but the team has capacity to address only three this quarter, how do you decide which three to fix first?', hints:['Use a <b>risk scoring matrix</b>: severity of impact × probability of failure × detectability', 'Severity: how many users affected? which revenue streams? which SLOs breached if this fails?', 'Probability: historical incident frequency, vendor reliability data, component age and tech debt', 'Detectability: is this SPOF visible in current monitoring, or would it be a silent failure?', 'Prioritise SPOFs on the <b>critical path of highest-priority user journeys</b> above all others', 'Communicate the backlog transparently — remaining SPOFs should be in the risk register with named owners and dates'] },
    ]
  },
  {
    id:'service-capacity', title:'Service & Capacity Availability', icon:'📊',
    questions:[
      { type:'open', topic:'Capacity Modelling', text:'Describe how you have built a capacity model for a system with genuinely unpredictable traffic — not just seasonal peaks but viral or externally triggered spikes — and what testing gave you confidence in that model.', hints:['Start with historical traffic data: <b>P50, P95, P99</b> baseline and the distribution of spike magnitudes', 'Model worst-case: what is the highest traffic ever observed, and what multiple of that should the system absorb?', 'Test at 150% and 200% of expected peak using a load tool (<b>k6, Gatling, Locust</b>)', 'Validate <b>auto-scaling trigger sensitivity</b>: does it scale out fast enough to stay ahead of a sharp ramp?', 'Identify the bottleneck component: often DB connections, thread pools, or downstream API rate limits', 'Discuss pre-warming strategies for known events and on-demand burst for unknown viral events'] },
      { type:'closed', topic:'Cloud Service Limits', text:'Has a cloud service quota or limit ever caused an incident or near-miss in a system you were responsible for, and what controls did you put in place afterwards?', hints:['A "yes" is common and reveals operational maturity — common culprits: Lambda concurrency, ECS task limits, API Gateway TPS', 'Post-incident controls: CloudWatch alarms at 70% of quota threshold, weekly quota utilisation report', 'Proactive approach: quota review as part of <b>capacity planning cadence</b> and new feature launch checklist', 'Distinguish: <b>soft limits</b> (auto-increase available) vs <b>hard limits</b> (require architectural rethink)', 'Infrastructure-as-code: quotas should be explicitly requested in Terraform/Pulumi modules where supported', 'Strong answer: candidate describes a process change, not just a one-time fix'] },
      { type:'open', topic:'Load Profile Design', text:'How do you translate real user behaviour into a representative load test scenario, and what are the most common mistakes you have seen teams make when modelling load?', hints:['Capture real traffic patterns: session lengths, think times, journey mix ratios from analytics or APM', 'Common mistake 1: <b>constant-rate tests</b> that miss ramp-up dynamics and sudden burst behaviour', 'Common mistake 2: <b>single-endpoint hammering</b> instead of realistic multi-step user journeys', 'Common mistake 3: ignoring <b>read/write ratio</b> — production may be 90% reads, not 50/50', 'Include background jobs and batch workloads that compete for shared resources with interactive traffic', 'Validate model against production APM data: does the test\'s resource utilisation pattern match production shape?'] },
      { type:'mixed', topic:'Auto-Scaling Validation', text:'Describe a chaos experiment you have designed or executed specifically to validate that auto-scaling behaves correctly under sudden demand spikes rather than just steady ramp-up.', hints:['Sudden spike is qualitatively different from ramp: tests <b>cold scale-out path</b> not just warm path', 'Experiment design: inject a step-change in CPU or request rate from 10% to 200% load in under 30 seconds', 'Observe: does scaling alarm trigger within expected window? do new instances become healthy before SLO breach?', 'Also test the <b>scale-in path</b>: does traffic drain correctly before instances are deregistered?', 'Common failure mode: new instance bootstrap time (dependency warm-up, cache priming) exceeds scale-out margin', 'Result: if SLO is breached during scale-out, either pre-warming strategy or scale-out trigger sensitivity must change'] },
      { type:'open', topic:'AZ/Region Availability', text:'Walk me through how you would build an early warning system that alerts you to cloud provider availability degradation before your customers experience impact.', hints:['Subscribe to <b>AWS Health API, Azure Service Health Events</b> and ingest them into your alerting pipeline', 'Run <b>synthetic canary transactions</b> from multiple regions that probe cloud APIs independently of your own services', 'Correlate cloud provider metrics with your own: rising error rates coinciding with provider events = leading indicator', 'Use <b>anomaly detection</b> on baseline latency to catch cloud-provider-side degradation before it crosses error thresholds', 'Set escalation runbooks triggered by provider health events — engage before customer complaints arrive', 'Blind spot check: ensure your monitoring infrastructure is not hosted in the same AZ/region it is monitoring'] },
      { type:'closed', topic:'Capacity Planning', text:'Does your organisation perform regular capacity planning reviews, and how does chaos or performance testing evidence feed into those reviews?', hints:['Mature orgs: quarterly capacity review with input from traffic forecasts, cost data, and test results', 'Testing evidence: load test results showing actual headroom at current provisioning vs projected peak', 'Chaos evidence: failure point data — at what scale does the system start degrading?', 'Link to business planning: capacity should be sized for next quarter\'s projected traffic, not last quarter\'s actuals', 'Common gap: capacity planning exists on paper but is not data-driven — teams guess rather than test', 'Strong answer: candidate describes a specific capacity decision that testing data changed'] },
      { type:'open', topic:'Graceful Degradation', text:'Your service hits 100% capacity under an unexpected load spike. Describe the sequence of degradation behaviours you would want the system to exhibit, and how you would test each one in advance.', hints:['Layer 1: <b>request queuing</b> with bounded queue — prevents cascade but increases latency', 'Layer 2: <b>rate limiting and 429 responses</b> to lower-priority callers — protects critical flows', 'Layer 3: <b>feature shedding</b> — disable non-essential features (recommendations, analytics) to protect core', 'Layer 4: <b>graceful 503 with retry-after header</b> — honest signal to clients rather than silent drop', 'Test each layer explicitly: load test to threshold, verify each degradation behaviour activates in sequence', 'Avoid: silent failures, spinning timeouts, or opaque 500 errors that give clients no recovery guidance'] },
      { type:'mixed', topic:'Cloud Migration Resilience', text:'You are migrating a stateful on-premises application to a cloud environment. What resilience assumptions change in the migration, and how do you test the new assumptions are valid before cutting over?', hints:['On-prem assumption: <b>persistent local storage, fixed IPs, low-latency internal network</b> — all change in cloud', 'Stateful challenge: session state, file uploads, and database connections often rely on on-prem invariants', 'New failure modes: <b>instance termination at any time, AZ outages, VPC/NAT gateway limits</b>', 'Pre-cutover testing: run application in cloud with production-mirrored data and synthetic traffic', 'Chaos tests in cloud-native environment: instance termination, AZ failure, network partition between tiers', 'Cutover risk mitigation: <b>parallel run period</b> with traffic comparison before DNS cutover'] },
      { type:'closed', topic:'Load Testing Automation', text:'Are your load and performance tests automated and run on every significant deployment, or are they ad hoc exercises triggered manually before major releases?', hints:['Continuous performance testing is a maturity indicator — ad hoc tests miss regressions between major releases', 'Pipeline integration: load test runs in staging after each deployment, results compared to previous baseline', 'Regression detection: automated comparison of P95/P99 latency, throughput, and error rate against baseline', 'Tooling: <b>k6 with Grafana k6 Cloud, Gatling CI plugin, Artillery in GitHub Actions</b>', 'Challenge: test environment fidelity — does staging have representative data volume and infrastructure sizing?', 'Strong answer: candidate describes a performance regression caught in pipeline before it reached production'] },
      { type:'open', topic:'Service Limit Testing', text:'Describe how you would design a test to verify your application handles cloud service quota exhaustion gracefully rather than failing with an unhandled exception.', hints:['Identify which quotas are reachable under peak load: Lambda concurrency, SQS message size, DynamoDB TPS', 'Test approach: deliberately approach or exceed quota in a safe environment and observe application behaviour', 'Expected behaviour: <b>graceful retry with backoff, fallback path activation, or clear error surfaced to user</b>', 'Check error handling: does the application distinguish quota errors from other failures in logs and metrics?', 'Validate alerting: does an alert fire before quota is exhausted, not after service is degraded?', 'Fix: if application throws unhandled exception on quota hit, treat as a bug requiring explicit error handling code'] },

  {
    id:'disaster-recovery', title:'Disaster Recovery Preparedness', icon:'🛡️',
    questions:[
      { type:'open', topic:'DR Test Design', text:'Design a DR test for a regional cloud failure that produces meaningful evidence rather than just a binary pass/fail. What are you measuring, and how do you ensure the test reflects realistic conditions?', hints:['Define measurable outcomes: <b>actual RTO in minutes, actual RPO in data records lost, error rate during transition</b>', 'Realistic conditions: test under representative load, not at 2am with zero traffic', 'Test stages: healthy baseline → failure injection → failover → validation → recovery → post-analysis', 'Measure continuously: MTTD (how fast did monitoring detect the failure?), transition time, error rate spike', 'Data integrity check: after failover, verify no transactions are lost or duplicated', 'Produce an evidence artefact: time-stamped metrics dashboard exported for audit and stakeholder review'] },
      { type:'closed', topic:'Runbook Quality', text:'Have you ever executed a DR runbook during an actual incident and found it was inaccurate or incomplete — and what was the operational impact of that gap?', hints:['A "yes" here is expected from experienced engineers — runbooks rot without regular testing', 'Impact: added minutes to MTTR; in worst cases required escalation that the runbook was supposed to prevent', 'Root cause: runbook written once, never tested, system changed underneath it', 'Fix: <b>runbooks executed in DR drills at least quarterly</b> — any step that fails is a P1 bug', 'Structure improvement: each runbook step should have expected output and explicit escalation trigger', 'Strong answer: candidate describes introducing a runbook-testing discipline as a result of the gap'] },

      { type:'mixed', topic:'Active-Active vs Active-Passive', text:'You are advising a team choosing between active-active and active-passive multi-region designs. Beyond cost, what resilience and testability trade-offs would you highlight, and how does the choice change your testing approach?', hints:['Active-active: continuously exercised — <b>resilience is proven by production traffic</b>, not just drills', 'Active-active testing challenge: <b>data consistency validation</b> under split-brain conditions is complex', 'Active-passive: lower complexity but <b>rarely exercised</b> — DR drills are the only evidence the standby works', 'Active-passive risk: passive side may be warmer on paper than in reality (config drift, stale data, unpatched)', 'Testing active-passive: include a full data comparison after failover, not just a "service responds" check', 'Strong candidate: discusses <b>warm standby vs cold standby</b> as a middle ground and its specific test implications'] },
      { type:'open', topic:'Network Redundancy', text:'Walk me through how you would test that your network architecture has no single points of failure, including at the DNS, CDN, and load balancer layers.', hints:['DNS: test with multiple resolvers, verify <b>health-check-driven failover</b> works at configured TTL', 'CDN: disable origin and verify CDN serves cached content; measure origin-failure detection and edge failover time', 'Load balancer: inject unhealthy backend instances and measure <b>deregistration and rerouting time</b>', 'Cross-cutting: use chaos tooling to <b>black-hole network paths</b> between layers and observe failover', 'Validate DNS TTL: shorter TTL = faster failover but higher DNS query load — find the right balance for your RTO', 'Blind spot: test from <b>external vantage points</b> — internal health checks may not reflect user-facing DNS resolution'] },
      { type:'closed', topic:'DR Automation', text:'Are your disaster recovery procedures automated to the point where a first-responder could trigger regional failover without architect involvement, or does every DR event require senior escalation?', hints:['Best practice: runbooks should be executable by <b>any trained on-call engineer</b>, not just senior architects', 'Automation level: fully automated failover vs guided-manual vs senior-required — each has trade-offs', 'Fully automated: fast, consistent, but risky if triggered incorrectly — requires robust safeguards and abort mechanisms', 'Guided-manual: engineer follows runbook with decision points — balances speed and human judgment', 'Measure: at what point in the incident does the first architect get paged? That is the automation gap', 'Strong answer: describes how they reduced senior escalation dependency through documentation and drill practice'] },
      { type:'open', topic:'Incremental DR Validation', text:'How do you use chaos engineering to build confidence in your DR plan incrementally, rather than waiting for an annual full-scale DR drill that tests everything at once?', hints:['Decompose DR into testable sub-scenarios: <b>single AZ failure → multi-service failure → full regional failure</b>', 'Run component-level DR tests monthly, service-level quarterly, regional annually — build evidence progressively', 'Each level produces measurable evidence: RTO/RPO data, error counts, manual steps required', 'Use <b>LitmusChaos workflow chaining</b> or <b>Gremlin scenarios</b> to compose multi-step failure sequences', 'Treat each chaos experiment as a mini-DR validation, not just a resilience test', 'Document a <b>resilience maturity ladder</b>: current level with evidence, target level with gap analysis'] },
      { type:'mixed', topic:'Data Recovery', text:'Describe the specific test you would run to validate that your database failover does not result in data loss or duplication for in-flight transactions at the moment of failure.', hints:['Inject failover during an active write workload — not when the system is idle', 'Observe: do in-flight transactions complete, roll back cleanly, or produce duplicate records?', 'Application behaviour: does the application retry correctly on connection reset, or double-submit?', 'Check <b>idempotency</b>: submitting the same transaction twice must produce one result, not two', 'Validate replication lag at moment of failover — this gap defines the actual RPO achieved, not the theoretical one', 'Use APM tracing to correlate transaction IDs across primary and replica to detect any divergence'] },
      { type:'closed', topic:'Backup Validation', text:'Do you perform automated restore tests on a regular schedule — actually restoring from backup and verifying data — or do you rely on backup job success notifications alone?', hints:['Backup job success = the backup ran, not that it is restorable — a fundamentally insufficient signal', 'Best practice: <b>automated daily or weekly restore</b> to an isolated environment with integrity checks', 'Integrity checks: row counts, referential integrity, application-level smoke tests against restored data', 'Tooling: AWS Backup audit reports, Azure Backup reports, or custom Lambda/script restore pipelines', 'Alert on restore test failures with the same urgency as production incidents', 'Strong candidate: describes finding a restore failure before it became a DR crisis — ideally due to this exact practice'] },
      { type:'open', topic:'Runbook Design', text:'Design a DR runbook section for a scenario where the primary database region has failed and a replica must be promoted. What makes the difference between a runbook that works under pressure and one that fails when it matters most?', hints:['Clarity: each step has an explicit expected output and a failure condition that triggers escalation', 'Commands: copy-paste ready — no ambiguity about which cluster, which flag, which endpoint to update', 'Decision tree: if replica promotion fails, what is the alternative path? runbook must have branches', 'Time budget: each step labelled with expected duration — engineer knows if they are behind RTO pace', 'Links embedded: direct URLs to relevant dashboards, AWS/Azure console pages, and escalation contacts', 'Validation step: after promotion, a checklist to verify application traffic has shifted and writes are succeeding'] },
    ]

  {

    questions:[
      { type:'open', topic:'Stateless Architecture', text:'Explain the resilience implications of stateful vs stateless application tiers, and describe a migration from stateful to stateless that you led or were part of — what broke, and what improved?', hints:['Stateful: instance failure loses session data → sticky sessions needed → horizontal scaling constrained', 'Stateless: state externalised to Redis/DynamoDB → any instance can serve any request → scale freely', 'Migration: the state migration itself is the risky phase — describe how it was handled with zero data loss', 'What broke: often local file assumptions, in-memory caches, or session-scoped background jobs', 'What improved: can now kill any instance in a chaos test without user impact; deployment flexibility increased', 'New resilience concern introduced: the external state store is now a critical dependency and must be resilience-tested'] },
      { type:'closed', topic:'Health Checks', text:'Have you encountered a system where health checks were returning healthy but users were experiencing failures — and how did you diagnose and fix the mismatch?', hints:['Classic scenario: health endpoint returns 200 but underlying dependency (DB, cache, downstream API) is failing', 'Diagnosis: compare health check response with actual transaction success rate from APM', 'Fix: deepen the health check — probe the actual dependencies, not just process liveness', 'Distinction: <b>liveness probe</b> (is the process alive?) vs <b>readiness probe</b> (can it serve requests correctly?)', 'Risk of over-engineering health checks: a health check that always fails cascades the outage to load balancer', 'Strong answer: describes specifically what the health check was missing and what was added'] },
      { type:'open', topic:'Circuit Breakers', text:'How do you determine correct circuit breaker thresholds for a specific dependency, and describe how you would validate that the circuit breaker is tuned correctly using controlled fault injection.', hints:['Wrong thresholds: too sensitive = false positives causing unnecessary degradation; too lenient = cascade unchecked', 'Determine thresholds from baseline data: what is the normal error rate for this dependency? (often 0.1–0.5%)', 'Set trip threshold meaningfully above baseline to avoid false positives — e.g. trip at 20% error rate in 10s window', 'Validation: inject increasing error rates (5%, 10%, 20%, 30%) and verify circuit opens at the configured threshold', 'Validate half-open state: after recovery interval, circuit probes with limited traffic — does it close correctly?', 'Validate fallback path: when circuit is open, does the fallback produce the correct user experience or error?'] },
      { type:'mixed', topic:'Kubernetes Resilience', text:'What are the top three Kubernetes-specific failure modes you would target in a chaos testing programme, and how does each one require a different testing approach?', hints:['<b>Pod OOMKill</b>: inject memory pressure, verify pod restarts, new pod schedules, and traffic re-routes in time', '<b>Node failure</b>: drain or terminate a node, verify pods reschedule within PodDisruptionBudget constraints', '<b>Control plane degradation</b>: limited API server access — verify cluster continues serving traffic for existing pods', 'Each requires different chaos tools: <b>LitmusChaos pod-delete, node-drain, or network-chaos experiments</b>', 'PodDisruptionBudget validation: chaos tool must respect PDB — if it does not, test is unsafe for production', 'Observation layer: readiness probes, HPA metrics, and service endpoint count all must be monitored during experiments'] },
      { type:'open', topic:'Traffic Failover', text:'Describe how you would test that traffic failover between application instances happens within your SLO-acceptable error window when an instance fails mid-request.', hints:['Define the acceptable window: how many user-facing errors are allowable during an instance failure?', 'Test: kill an instance while it is serving traffic and measure <b>error count and duration</b> from user perspective', 'Validate connection draining: load balancer should stop sending new requests before instance terminates', 'Check in-flight requests: are they completed, retried, or dropped? which is acceptable for this service?', 'Measure <b>health check deregistration time</b>: faster health checks = smaller error window during failure', 'Validate at different traffic levels: a failure during peak load has a very different impact than at low traffic'] },
      { type:'closed', topic:'Auto-Scaling', text:'Have you identified a case where auto-scaling was configured but did not trigger fast enough to prevent a user-facing degradation, and what were the root causes?', hints:['Common root cause 1: <b>scaling metric lagged</b> — CPU averaged over 5 mins masked a 30-second spike', 'Common root cause 2: <b>scale-out cooldown period</b> prevented a second scaling action when the first was insufficient', 'Common root cause 3: <b>new instance bootstrap time</b> (2–5 mins) exceeded the scale-out margin', 'Common root cause 4: <b>max instance limit hit</b> due to account quota or ASG cap', 'Fix: switch to shorter metric windows, reduce cooldown, pre-warm AMIs, or use predictive scaling', 'Strong answer: describes the specific metric graph that revealed the timing gap and the configuration change made'] },
      { type:'open', topic:'Message Queue Resilience', text:'Design a series of fault injection experiments to validate the resilience of an event-driven architecture where services communicate via a message queue (e.g. Kafka or SQS).', hints:['Test 1: <b>consumer group failure</b> — kill all consumers and verify messages queue safely without loss', 'Test 2: <b>poison message injection</b> — send malformed message and verify DLQ routing without blocking the queue', 'Test 3: <b>broker failure</b> (Kafka) — kill a broker, verify partition leader election and no message loss', 'Test 4: <b>consumer lag injection</b> — slow consumers artificially, verify producer is not blocked and backpressure is handled', 'Test 5: <b>duplicate delivery</b> — verify consumer idempotency by replaying the same message twice', 'Observe: message ordering guarantees, at-least-once delivery behaviour, and DLQ contents after each experiment'] },
      { type:'mixed', topic:'Resilience Patterns', text:'Describe a situation where a resilience pattern (e.g. retry, circuit breaker, timeout) was implemented incorrectly and caused or worsened an incident. What did you learn?', hints:['Retry without backoff: retries hammered a recovering service, amplifying the outage instead of recovering from it', 'Circuit breaker too sensitive: false positives caused healthy dependencies to be circuit-broken, cascading the failure', 'Timeout too long: threads held open for 60 seconds against a failed dependency, exhausting the thread pool', 'Lesson: every resilience pattern has a failure mode when misconfigured — patterns need their own tests', 'Process improvement: resilience pattern configurations should be <b>code-reviewed and chaos-tested</b> before go-live', 'Strong answer: candidate can describe the specific configuration mistake and the chaos test that would have caught it'] },
      { type:'closed', topic:'Feature Flags', text:'Have you used feature flags as an incident response mechanism to disable a failing feature without a code deployment, and was this capability tested before the incident occurred?', hints:['Best practice: feature flag killswitch paths should be <b>tested in staging</b> before reliance on them in production', 'Test: disable flag in staging, verify feature gracefully degrades, then re-enable and verify recovery', 'Propagation latency: how quickly does a flag change reach all instances? — this bounds your incident response time', 'Governance: long-lived flags accumulate; each flag should have an expiry and cleanup owner', 'Integration: feature flag state should be visible in <b>dashboards alongside incident metrics</b>', 'Weak answer: "we have LaunchDarkly" — strong answer: "we have tested each killswitch flag produces the correct degraded UX"'] },
      { type:'open', topic:'Service Mesh Resilience', text:'How does a service mesh (e.g. Istio or Linkerd) change your approach to resilience testing, and what failure modes become testable at the mesh layer that were not testable before?', hints:['Mesh-level fault injection: inject latency and HTTP errors at the proxy layer without changing application code', 'Istio VirtualService fault injection: <b>httpFault for abort and delay rules</b> — highly targeted, per-route', 'New testable scenarios: request routing failures, mTLS negotiation failures, service discovery failures', 'Mesh observability: <b>Envoy metrics and distributed traces</b> provide richer data during experiments', 'Mesh-managed retries and circuit breaking: validate that mesh-level policies interact correctly with app-level patterns', 'Risk: mesh adds complexity — <b>mesh itself can be a SPOF</b> if control plane fails; should be chaos tested too'] },
    ]

  {
    id:'data-platform', title:'Data Platform Reliability', icon:'🗄️',
    questions:[
      { type:'open', topic:'Database Failover', text:'Walk me through the exact sequence of events during a managed database failover (e.g. RDS Multi-AZ) and describe where in that sequence you have seen applications fail to handle the transition gracefully.', hints:['Sequence: primary failure detected → standby promoted → DNS endpoint updated → application reconnects', 'Typical failover window: <b>60–120 seconds</b> for managed services — what happens to user requests in that window?', 'Application failure modes: connection not retried, ORM cache holds stale connection, DNS TTL too long to detect change', 'Most common gap: application opens a connection at startup and never refreshes — a stale connection after failover causes errors', 'Test: trigger failover mid-transaction and observe error type — is it a clean connection reset or a silent hang?', 'Fix: connection pool with reconnection logic, short DNS TTL for DB endpoint, retry with backoff in application layer'] },
      { type:'closed', topic:'Replication Validation', text:'Have you ever discovered that database replication lag was exceeding your RPO threshold in production without any alerting — and how did you find it and fix the monitoring gap?', hints:['Replication lag is often invisible until a DR drill or actual failover reveals stale data', 'Discovery: during a DR test, data delta was larger than expected — investigation revealed lag had been building for hours', 'Monitoring gap: no alert on <b>replication lag metric</b> — or alert threshold was too conservative', 'Fix: add replication lag alert at a threshold that gives headroom before RPO breach (e.g. alert at 50% of RPO)', 'Continuous validation: replication lag should be a <b>first-class dashboard metric</b>, not a background concern', 'Strong answer: describes the specific threshold chosen, how it was calibrated, and how it has caught lag events since'] },
      { type:'open', topic:'Data Consistency', text:'Describe a real or hypothetical scenario where eventual consistency in your data layer caused a user-visible bug, and walk through how you would design tests to detect this class of issue systematically.', hints:['Classic scenario: user updates profile, immediately reads it back, sees old data — read replica served stale result', 'Systematic test: write a record, immediately read from replica, compare — measure how often read is stale and by how much', 'Inject replication lag with chaos and verify application behaviour under stale-read conditions', 'Application-level fix: <b>read-your-writes consistency</b> — route reads to primary immediately after writes', 'Monitoring: track <b>stale read rate</b> as an application-level metric, not just a DB-level metric', 'Design principle: the application must be explicit about which reads require strong consistency vs can tolerate stale data'] },
      { type:'mixed', topic:'Restore Validation', text:'Your organisation claims an RPO of 4 hours for its data warehouse. Describe in detail the test you would design and run to either validate or invalidate that claim.', hints:['Define the validation criterion: after simulating failure, restore to within 4 hours of failure point, measure actual data age', 'Test setup: take a snapshot, generate 3.5 hours of synthetic transactions, simulate failure, attempt restore', 'Measure restore duration: does the restore itself take longer than the remaining RTO budget allows?', 'Validate data completeness: are all transactions from the pre-failure window present in the restored dataset?', 'Validate application behaviour: does the application function correctly against the restored dataset?', 'Document results: if RPO is met, produce evidence; if not, raise a severity-1 finding with remediation timeline'] },
      { type:'open', topic:'Read Replica Failure', text:'Describe how you would test that your application gracefully handles a complete read replica outage, including the impact on primary database load when reads are rerouted.', hints:['Kill all read replicas simultaneously and observe: does application fall back to primary for reads?', 'Primary impact: read traffic rerouted to primary can overwhelm it — this is a common cascade failure mode', 'Test primary saturation: measure primary CPU, connection count, and query latency during replica outage', 'Validate read/write routing logic: confirm that read fallback to primary actually happens, not silent failure', 'Connection pool sizing: is the primary pool large enough to absorb both read and write traffic?', 'Recovery test: restore replicas and verify traffic gradually shifts back without application restart'] },
      { type:'closed', topic:'Multi-AZ Database', text:'Have you actually triggered a Multi-AZ failover in a production-like environment and timed the full recovery — from failure to application serving traffic normally?', hints:['A "yes" with specific timing data is a strong signal — "we assumed it works" is a red flag', 'Typical RDS Multi-AZ failover: 60–120 seconds, but application reconnection adds time on top', 'What the timer should measure: failure trigger → last error at application layer → normal traffic resume', 'Candidate should know the <b>actual measured time</b>, not the theoretical SLA from the cloud provider', 'Common finding: failover itself is fast, but application connection retry logic adds 2–3 minutes on top', 'Strong answer: describes the test, the measured time, and what was tuned as a result'] },
      { type:'open', topic:'Data Migration Resilience', text:'How do you test the resilience and data integrity of a live database migration where you cannot afford downtime and must be able to roll back if something goes wrong?', hints:['Technique: <b>expand-contract pattern</b> — add new schema alongside old, migrate data in background, then switch reads', 'Validation: run old and new schema in parallel, compare outputs for a defined shadow period', 'Rollback test: deliberately trigger rollback condition in staging and verify old schema is still consistent', 'Data integrity checks: row counts, checksums, and application-level smoke tests at each migration stage', 'Monitoring: track application error rate throughout migration — any spike triggers immediate rollback', 'Strong answer: candidate has done zero-downtime migrations and can describe the specific validation steps used'] },
      { type:'mixed', topic:'CQRS Consistency', text:'In an event-sourced or CQRS system, how do you test the consistency gap between the write model and read model under failure conditions, and what user experience do you accept during the gap?', hints:['CQRS: write model updated immediately; read model (projection) updated asynchronously — gap is inherent', 'Failure scenario: event processor crashes — projection becomes stale until processor recovers', 'Test: kill the projection processor mid-stream and measure how stale the read model becomes over time', 'Validate idempotency: after processor restart, events replayed — does the projection reach the correct final state?', 'User experience decision: show stale data with a "refreshing" indicator vs block until projection catches up?', 'Alert: projection lag should trigger an alert well before it affects user experience — define that threshold'] },
      { type:'closed', topic:'Backup Encryption', text:'Have you ever tested restoring from an encrypted backup and discovered an issue with key availability or permissions that would have prevented recovery in a real DR scenario?', hints:['Common finding: backup encrypted with a KMS key that the restore IAM role does not have access to', 'Also common: KMS key deleted or rotated after backup was taken — backup is unrecoverable', 'Test: restore backup in an isolated account with only the documented minimum permissions — does it work?', 'Key management: backup encryption keys must have their own <b>retention and access policy</b> reviewed alongside RPO', 'Multi-account DR: if DR account differs from production account, cross-account KMS key grants must be explicitly tested', 'Strong answer: candidate describes finding this exact issue in a restore test and the key policy fix applied'] },
      { type:'open', topic:'Database Connection Resilience', text:'Describe how you would instrument and test database connection pool behaviour during a failure event to ensure the pool recovers cleanly rather than becoming deadlocked or permanently degraded.', hints:['Instrument: <b>active connections, idle connections, wait time, timeout rate</b> as metrics in Datadog/Dynatrace', 'Test: kill the DB, observe pool behaviour — do connections drain correctly or hold open indefinitely?', 'Validate pool eviction: does the pool detect stale connections and evict them after failover?', 'Connection leak test: under high load, confirm connections are returned to pool correctly — look for gradual pool depletion', 'Restart test: bounce the application under load and verify pool initialises correctly against the DB', 'Threshold: define pool size limits that prevent DB connection exhaustion during peak, validated by load + chaos combined'] },
    ]
